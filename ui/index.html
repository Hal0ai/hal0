<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Favicon / brand icons. Assets live in ui/public/ and Vite copies them
         to the dist root at build time; the hal0-api also serves /favicon.svg
         and mounts /brand. The yellow-halo mark is #feaf00. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/logo-halo-dark-favico.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#feaf00" />

    <title>hal0 dashboard — v0.5.0-alpha.1</title>
    <meta
      name="description"
      content="hal0 v0.5.0-alpha.1 dashboard — container-runtime slots, NPU trio, OmniRouter, agent approvals. Operator surface for a local AI appliance."
    />

    <!-- Fonts are self-hosted via @fontsource imports in src/main.tsx — no
         external font CDN: the dashboard must render identically on an
         offline LAN box. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
