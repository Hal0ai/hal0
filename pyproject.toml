[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

# NOTE: the DISTRIBUTION name is "hal0ai" (what `pip install` fetches).
# PyPI rejects "hal0" under its name-similarity guard (too close to the
# existing "halo" project). The import package stays `hal0` (see
# [tool.hatch.build.targets.wheel] below) and the console scripts stay
# `hal0` / `hal0-agent`, so only the pip-install name differs. Anything
# that resolves this project by distribution name must use "hal0ai".
[project]
name = "hal0ai"
version = "1.0.0-rc.1"
description = "Open-source home AI inference platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "hal0 contributors" }]
keywords = ["ai", "llm", "inference", "openai-compatible", "homeai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  # Upper bound is deliberate. hal0 introspects ``app.routes`` to autogenerate
  # the MCP admin tool catalog, and FastAPI has already changed that structure
  # once inside a minor release: 0.138 stopped flattening ``include_router`` and
  # left ``_IncludedRouter`` wrappers in ``app.routes``. The walker
  # (``hal0.mcp.admin._iter_leaf_routes``) now descends through them, but the
  # installer resolves this file — not ``uv.lock`` — so without a ceiling a
  # fresh install silently picks up whatever FastAPI ships next and can lose the
  # entire MCP surface with the API still reporting healthy. Raise this
  # deliberately, after running tests/mcp/test_admin_route_map_nested.py against
  # the new version.
  "fastapi>=0.115,<0.140",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "typer>=0.15",
  "structlog>=24.4",
  "tomli-w>=1.0",
  "rich>=13.9",
  # ADR-0004 (Phase 8): hal0 ships /mcp/admin + /mcp/memory MCP servers.
  # MIT-licensed Python SDK; consumed by hal0.mcp.* — required at
  # import time, hence core (not optional).
  "mcp==1.28.1",
  # v0.3 Hermes-Agent bootstrap (issue #241): config_write phase
  # renders $HERMES_HOME/config.yaml from a Jinja2 template + deep-merges
  # /etc/hal0/agents/hermes/overrides.yaml. Both libs were already
  # transitive via fastapi; pin them explicitly so the bootstrap
  # surface stops relying on a sibling package keeping them on disk.
  "Jinja2>=3.1",
  "PyYAML>=6.0",
  "psutil>=5.9",
  # hal0.updater._is_newer / hal0.updater._enforce_upgrade_floor need PEP 440
  # version + specifier comparison (rc/beta ordering, upgrade_from floors).
  # This was previously only a transitive dep of the `dev` extra (pytest), so
  # a production install (pip install hal0ai, no extras) never got it and
  # silently fell back to the broken naive tuple compare — a box on
  # 1.0.0rc1 was never offered 1.0.0/1.0.1 GA. Declare it directly.
  "packaging>=24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "httpx>=0.28",
  # Runtime deps of the in-container moonshine_server, loaded via
  # importlib by tests/providers/test_moonshine_server.py. Not on the
  # hal0 production path — only the toolbox image needs them at runtime
  # — but the test suite exercises the redaction logic from harness
  # finding #14.
  "numpy>=2.0",
  "soundfile>=0.12",
  # FastAPI's File()/UploadFile/Form() construction (used by the
  # moonshine_server multipart route) requires python-multipart at
  # import time. Same scope as numpy + soundfile above — toolbox-only
  # at runtime, but the test suite imports the FastAPI app.
  "python-multipart>=0.0.9",
]

# Optional error reporting. Deliberately NOT in `dependencies`: hal0 is a
# self-hosted appliance that phones home to nobody by default, and the
# absence of the package is a second, physical guarantee of that on top of
# the "no DSN ⇒ no-op" logic in hal0.observability.sentry. Install with
# `pip install 'hal0ai[sentry]'` only on boxes you want reporting from.
sentry = [
  "sentry-sdk>=2.20",
]

[project.scripts]
hal0 = "hal0.cli.main:app"
# hal0-agent is the small subprocess wrapper invoked by the systemd
# template ``hal0-agent@<id>.service`` (installer/systemd/). Kept as a
# separate console script (not a ``hal0 agent shim`` subcommand) so the
# unit's ExecStart points at a stable PATH binary instead of the full
# typer-loaded ``hal0`` CLI surface. See ``src/hal0/cli/agent_shim.py``
# for rationale and ``installer/systemd/hal0-agent@.service`` for the
# unit that drives it.
hal0-agent = "hal0.cli.agent_shim:main"

[project.urls]
Homepage = "https://hal0.dev"
Repository = "https://github.com/hal0ai/hal0"

[tool.hatch.build.targets.wheel]
packages = ["src/hal0"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Agentic-eval fixtures are TASK CONTENT (deliberately quirky code the agent
# under eval must read/trace), not hal0 source — linting must never "fix" them.
extend-exclude = ["src/hal0/bench/evals/agentic/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",  # line length (handled by formatter)
  "B008",  # function calls in argument defaults — Typer's documented API for Option/Argument
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
# #1490: the HAL0_HOME/model-registry fixtures that ride pytest's `tmp_path`
# write multi-GB payloads per run (measured: one generation at 6.3G), and
# pytest's own default keeps the last 3 generations under
# <tmpdir>/pytest-of-<user>/. On this project's dev boxes /tmp is routinely a
# small tmpfs, so three concurrent/recent runs is enough to fill it and
# ENOSPC every other tool on the host (including test-runner output capture
# itself). Retain ONLY failed-test tmp_path dirs, and only the latest
# generation of those — a passed test's fixture tree is disposable the
# moment it passes; a failed one is exactly what you want left behind to
# inspect. (pytest >=7.3; this repo pins >=8.3.)
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
# Environment-dependent markers (P4-tests, pulled forward from R5): tag tests
# that shell out to a real host facility the *default* pytest run never
# guarantees (a container runtime, a live systemd/journald, outbound
# network). CI always runs the full unmarked suite unchanged — these exist
# so a LOCAL capped verify can opt out with
# `-m "not podman and not systemd and not network"` instead of avoiding
# whole files/dirs (tests/api hanging on a slow/absent podman or journalctl
# probe was the recurring local-only pain point). A future CI tier split can
# reuse the same markers; do not repurpose them for anything else.
filterwarnings = [
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
  "slow: tests that take >1s wall-clock (engine-contract fixtures, etc.)",
  "podman: needs a real container runtime (podman/docker) reachable on the host",
  "systemd: needs a live systemd/journald (systemctl, journalctl)",
  "network: needs outbound network access (registry pulls, live HTTP endpoints)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

# ADR-0018: machine-readable record of the Hermes-Agent upstream commit
# hal0 v0.3 is vendored/shimmed against. Single source of truth — the
# weekly hermes-sdk-diff workflow + scripts/hermes-sdk-diff.sh read this
# table and nothing else. Bumps go through the process documented in
# ADR-0018 §4 (review drift issue, edit shim adapter if needed, run
# `scripts/hermes-sdk-diff.sh --bump <sha>`, δ-harness + γ-suite, open
# `chore(hermes): bump upstream pin to <short-sha>` PR).
[tool.hal0.upstream-hermes]
# Aligned to the reviewed official compatibility freeze (research doc §"Supported
# compatibility freeze"): NousResearch/hermes-agent v2026.7.7.2 / 0.18.2, the same
# immutable commit the installer requirements.txt and the frozen contract fixtures
# (tests/fixtures/hermes/contracts/) pin. The drift-watch, the compat pin, and the
# fixtures MUST stay in lockstep — tests/agents/hermes/test_contract_compatibility.py
# enforces it. Preserve the prior earendil-works@0554ef1 (2026-05-28) as historical
# provenance in git history; it is NOT the production source of record.
repo   = "https://github.com/NousResearch/hermes-agent"
commit = "9de9c25f620ff7f1ce0fd5457d596052d5159596"
date   = "2026-07-07"

# Surfaces hal0 vendors, shims, or proxies. The diff job only opens an
# issue when one of these paths changes between the pinned commit and
# upstream HEAD; commits that don't touch this list are ignored.
#
# Expanded from the original six-file slice to the full contract surface the
# planned adapter suite (hal0-memory / hal0-provider / hal0-voice / executor
# bridge / jobs-cron automation) consumes, so a Hermes bump that would break an
# adapter trips the drift-watch first (research doc §Phase 0.3). Each path is
# annotated with the consuming lane. Every path is verified to exist at the
# pinned commit; the old earendil-only `agent/events.py` was dropped — it does
# not exist at the official pin (see the handback design-doc mismatch list).
tracked_files = [
    # hal0-memory
    "agent/memory_provider.py",      # MemoryProvider ABC (full lifecycle)
    "plugins/memory/__init__.py",    # specialized memory-plugin loader + layout
    # hal0-provider
    "providers/base.py",             # ProviderProfile (chat_completions transport)
    "providers/__init__.py",         # register_provider / get_provider_profile seam
    # hal0-voice
    "agent/tts_registry.py",         # TTS provider registry (Python path)
    "agent/transcription_registry.py",  # STT provider registry (Python path)
    "hermes_cli/voice.py",           # voice-mode command-provider machinery
    # executor bridge + jobs/cron automation + security (item 4)
    "gateway/platforms/api_server.py",  # /v1/runs, /api/sessions, /api/jobs, binds/keys
    # shared: plugin registration, config schema, hooks, cron
    "hermes_cli/plugins.py",         # PluginContext registration seams
    "hermes_cli/config.py",          # config defaults incl. terminal/memory/tts/stt
    "hermes_cli/hooks.py",           # lifecycle/gateway hook contract
    "hermes_cli/cron.py",            # scheduled-agent automation
    "hermes_cli/auth.py",            # has_usable_secret / placeholder denylist
    "agent/context_engine.py",       # optional future hal0-context ABC
    # dashboard SDK surface (tracked for drift; dashboard adapter is a non-goal
    # of the initial suite but the SDK contract still drifts hot upstream)
    "web/src/plugins/registry.ts",
    "web/src/plugins/slots.ts",
    "hermes_cli/web_server.py",
    "tools/registry.py",             # general tool registry (hal0-tools control plane)
    # hal0-hermes-kanban (board executor bridge, R5 §7 drift-watch blind spot)
    "hermes_cli/kanban_db.py",       # 7-table schema (tasks/task_links/task_comments/
                                      # task_events/task_runs/task_attachments/kanban_notify_subs)
    "plugins/kanban/dashboard/plugin_api.py",  # /api/plugins/kanban/runs* surface
                                      # HermesBoardExecutor (board/hermes_executor.py) calls
]
