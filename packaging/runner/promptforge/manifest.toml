# Provenance for the PromptForge runner image (#1946).
#
# CANDIDATE recipe: this manifest reproduces the accelerated-path runner for
# `jcbtc/Qwen3.8-27B-CIRU-ActiveFPX-PromptForge` (spec
# 2026-08-29-specialty-distributions). The tag it produces —
# ghcr.io/hal0ai/hal0-promptforge:v2.3-qwen38 — is a CANDIDATE, not yet the
# value `DEFAULT_PROMPTFORGE_IMAGE` (src/hal0/config/schema.py) is pinned to
# as an unconditional default. That pin only moves after the ct150
# validation gate (#1891) passes: the temp-0 Paris probe (same shape as
# rocmfpx's #1948 matrix), the card's stated quality/HumanEval envelope, and
# MTP (depth-4) acceptance. Same discipline #1888 forced onto
# DEFAULT_ROCMFPX_IMAGE — see packaging/runner/rocmfpx — applied here before
# the first build rather than after an incident.
#
# Modelled on packaging/runner/rocmfpx/manifest.toml: everything variable
# lives here, build.sh only executes it. But this is a DIFFERENT source tree
# (ciru-ai/ROCmFPX, not charlie's — see [source] below) and a narrower build
# target (HIP-only, one model family), so do not assume parity with rocmfpx
# beyond the shape of this file.
#
# The CT130 build pipeline job and the `Hal0ai/hal0-runner-images`
# `images.json` entry that actually build this recipe are tracked on #1946
# and are explicitly NOT part of this task — this manifest is the tracked
# recipe only, not runnable in this repo's CI.

[image]
#: The tag this recipe produces. CANDIDATE — see the header note above; keep
#: in lockstep with DEFAULT_PROMPTFORGE_IMAGE, itself a candidate pin until
#: the #1891 gate passes.
tag = "ghcr.io/hal0ai/hal0-promptforge:v2.3-qwen38"

[base]
#: RESOLVED 2026-08-30 (was the recipe's one open TODO). TheRock does NOT
#: publish a pullable ROCm runtime container — ghcr.io/rocm only exposes
#: `therock_build_manylinux_x86_64`, a toolchain image, and the dist
#: artifacts are release tarballs. So the "base" here is two pins, not one:
#: a plain distro image (below) and the TheRock dist tarball ([base.therock])
#: that build.sh unpacks into /opt/rocm in BOTH stages. rocmfpx's Kyuz0
#: ROCm-7.2.4 base was rejected, per rocmfpx's own warning: it bundles a
#: second ROCm tree that does NOT match the 7.15 toolchain these binaries
#: link against. fedora-minimal:43 is the distro the Kyuz0 family itself
#: builds on (rocmfpx [base] comment: fedora-minimal:43 lineage), so this
#: keeps distro-family parity with the rest of the runner fleet while
#: carrying zero ROCm of its own.
#:
#: Digest is the multi-arch OCI INDEX digest, resolved 2026-08-30 via
#: `docker buildx imagetools inspect` on the CT130 build host; build.sh
#: pulls `FROM ${image}@${digest}` in both stages.
image = "registry.fedoraproject.org/fedora-minimal:43"
digest = "sha256:64d7765c1c6af97ff168d112eee06731676ad32bd5a8fc15d97cfd938ad4e281"
#: PromptForge v2.3's card requires ROCm 7.15, built via TheRock
#: (https://github.com/ROCm/TheRock, AMD's newer ROCm build system). The
#: card pins no exact nightly; 7.15.0a20260728 below is the LAST build of
#: the 7.15 line (the versioning then jumped to 10.0.0a — TheRock's
#: renumber), from the legacy multi-arch nightly channel.
rocm_version = "7.15.0a20260728"
#: composable_kernel is the GEMM/conv kernel library rocBLAS/hipBLASLt link
#: against; CIRU ActiveFPX's FPX kernels are sensitive to which
#: composable_kernel commit the toolchain was built against, so the card
#: pins one explicitly rather than floating "whatever ROCm 7.15 shipped
#: with." https://github.com/ROCm/composable_kernel
composable_kernel_ref = "fdf4bb7fcc984811cef48ce817d89aac064b984a"

#: Same DEFERRED position rocmfpx takes on unpinned dnf packages (see that
#: manifest's comment for the full rationale) — provisional scaffolding,
#: not a considered decision for this recipe; the builder's dnf set is now
#: plain compiler/tooling packages only (zero ROCm, zero vulkan).
dnf_packages_pinned = false

#: The TheRock ROCm dist tarball build.sh unpacks into /opt/rocm in both
#: build stages — the actual 7.15 toolchain + runtime. Channel context:
#: TheRock's per-family S3 nightly bucket froze mid-June 2026; 7.15
#: nightlies live only in the LEGACY multi-arch channel below (TheRock
#: docs/packaging/legacy_multi_arch_releases.md — "nightly releases through
#: ROCm 7.14" plus this short 7.15 tail before the 10.0 renumber). The URL
#: is expected to stay stable; the sha256 is what build.sh actually
#: verifies before unpacking, computed 2026-08-30 from the fetched bytes on
#: CT130 (the bucket publishes CRC64NVME only, no sha256 sidecar to cross-
#: check against).
[base.therock]
url = "https://rocm.nightlies.amd.com/tarball-multi-arch/therock-dist-linux-gfx1151-7.15.0a20260728.tar.gz"
sha256 = "e6866abda85097caf22a2dce30c40adbcda4e09226014c852a916101feaf68e4"

[source]
#: ciru-ai's tree, NOT charlie's — the opposite choice from rocmfpx (see
#: that manifest's [source] comment: charlie's fork was pinned specifically
#: BECAUSE ciru's port emits invalid Vulkan tokens on gfx1151, #1888). That
#: defect does not matter here: this build is HIP-only (GGML_VULKAN=OFF,
#: see [build] below), so ciru's Vulkan regression never executes, and
#: ciru's tree is what the PromptForge v2.3 card actually specifies.
repo = "https://github.com/ciru-ai/ROCmFPX.git"
#: The full commit sha the card's tag `qwen3.8-activefpx-promptforge-v2.3`
#: peeled to on 2026-08-29 (`git ls-remote`, annotated tag object
#: 93e78aeb71ae815b9e12530dce5651d0d715db55) — pinned as a sha, not the
#: tag, matching rocmfpx's discipline: a tag can move silently, this can't.
ref = "103af8b411dfe47fe9110a480a02341137c68246"
ref_description = "release: fix Qwen structured output and small-row prefill (tag qwen3.8-activefpx-promptforge-v2.3)"
#: TODO(operator): not verified for this tree/ref. Copied from rocmfpx as a
#: starting assumption only, not a checked fact.
submodules = false

[build]
#: gfx1151 (Strix Halo) — unchanged from rocmfpx; same hardware target, just
#: a different (HIP-only) backend combination.
gpu_arch = "gfx1151"
cmake_flags = [
    "-DGGML_HIP=ON",
    "-DGGML_HIP_ROCWMMA_FATTN=OFF",
    "-DGGML_HIP_FORCE_MMQ=ON",
    # The one flag flip vs rocmfpx (which builds this ON): the PromptForge
    # v2.3 card requires a HIP-only build. rocmfpx's combined HIP+Vulkan
    # image cannot be reused for this flavor — #1946 item 4 found the two
    # backends are a mutually exclusive requirement here (unlike rocmfpx,
    # where combining them into one tag is the whole point of that
    # recipe's [build] comment) — so this image can never share a tag with
    # DEFAULT_ROCMFPX_IMAGE and needs its own recipe, which is this file.
    "-DGGML_VULKAN=OFF",
    "-DGGML_CUDA=OFF",
    "-DCMAKE_HIP_ARCHITECTURES=gfx1151",
    "-DGPU_TARGETS=gfx1151",
    # Card-specified flags (fetched 2026-08-29 from the model card's build
    # section, verbatim) — the card's exact gfx1151 configure line beyond
    # the flags already above. PROMPTFORGE_CK_ROOT points build.sh's
    # composable_kernel checkout (pinned in [base]) at the FPX kernels.
    "-DAMDGPU_TARGETS=gfx1151",
    "-DGPU_BUILD_TARGETS=gfx1151",
    "-DGGML_HIP_GRAPHS=ON",
    "-DGGML_HIP_MMQ_MFMA=ON",
    "-DGGML_HIP_NO_VMM=ON",
    "-DGGML_NATIVE=ON",
    "-DPROMPTFORGE_CK_ROOT=../composable_kernel",
    "-DLLAMA_BUILD_SERVER=ON",
    "-DLLAMA_BUILD_WEBUI=OFF",
    "-DLLAMA_USE_PREBUILT_WEBUI=OFF",
]

#: Card-specified runtime mode envs (beyond the three sidecar path vars the
#: app synthesizes from SPECIALTY_KINDS). These enter the registry's
#: `mode_env` ONLY after the ct150 gate (#1891) validates them on real
#: silicon — recorded here so the gate run has the card's exact values:
#:   PROMPTFORGE_MODE=m2048_fused_tail1476
#:   PROMPTFORGE_ENABLE_SMALLM_W8=1
#:   PROMPTFORGE_MTP_OUTPUT_K8=1
#:   PROMPTFORGE_MTP_OUTPUT_K8_VALIDATE=0

#: Applied in order to a pristine checkout of [source]. Unlike rocmfpx's
#: four patches (which patch charlie's llama.cpp tree itself and would not
#: apply to ciru's — different fork, different line contexts), this is the
#: single patch the PromptForge v2.3 card specifies, and it ships from the
#: MODEL repo, not from [source]. Reusing rocmfpx's patches/ mechanism (same
#: [[patches]] shape, same directory) for a differently-sourced patch,
#: deliberately, rather than inventing a second mechanism for one entry.
[[patches]]
file = "qwen38-v3-output-k8-runtime.patch"
remote_source = "https://huggingface.co/jcbtc/Qwen3.8-27B-CIRU-ActiveFPX-PromptForge"
remote_path = "runtime/qwen38-v3-output-k8-runtime.patch"
#: Verified 2026-08-29: fetched from the HF repo and hashed locally; matches
#: the card's digest table exactly. Real patch bytes are now vendored at
#: patches/qwen38-v3-output-k8-runtime.patch (627-line git patch), replacing
#: the loud placeholder stub — remote_source above remains the provenance.
sha256 = "8ba7d721ea380b060aeb0c7595b8b05f1582c0f7bf7a4b89e0910bc8e72465d5"
why = """
Tunes v2.3's output-K8 runtime companion path for this specific checkpoint
(PROMPTFORGE_MTP_OUTPUT_K8_PROXY; see spec
2026-08-29-specialty-distributions). Ships with the model card rather than
with ciru-ai/ROCmFPX itself, so it is fetched and applied from the HF model
repo above at build time, not from a local patches/ file the way rocmfpx's
four patches are. The vendored copy at
patches/qwen38-v3-output-k8-runtime.patch is the real 627-line patch
(fetched from the HF repo and hash-verified 2026-08-29, replacing the
earlier loud placeholder stub); the sha256 above matches both the vendored
bytes and the card's digest table.
"""

[verification]
#: What this image MUST be proven against before DEFAULT_PROMPTFORGE_IMAGE
#: (src/hal0/config/schema.py) can move to it as an unconditional default —
#: the ct150 validation gate, #1891. NOT YET RUN as of this recipe: this
#: table records the REQUIRED gate, not a completed one (contrast with
#: rocmfpx's [verification], which records probes that image already
#: passed). Full context: spec 2026-08-29-specialty-distributions, #1946.
gate_issue = "https://github.com/Hal0ai/hal0/issues/1891"
required_probes = [
    "temp-0 'The capital of France is' -> 'Paris' (same shape as rocmfpx's #1948 matrix)",
    "card-stated quality/HumanEval envelope reproduced within tolerance",
    "MTP (depth-4) acceptance rate within the card's stated envelope",
]
status = "not run — candidate pin only, pending #1891"
