# Provider presets: the built-in list of known upstream providers.
#
# Read by hal0.upstreams.presets. Never mutated at runtime; user
# configuration lives in upstreams.toml. API keys are never stored here.
#
# Per preset:
#   name, category (cloud|local|peer|custom), base_url, auth
#   (bearer|anthropic|header|none), auth_header_name, docs_url, notes,
#   tools (false renders "chat only, no tools"), quirks (data for the
#   dispatcher), [preset.<id>.rate_limit_headers], [[preset.<id>.models]].
#
# Model fields: id, type (chat|embed|rerank|tts|stt|image), context (tokens),
# price_in / price_out (list price per price_unit), recommended. A field is
# omitted when the provider's public docs did not confirm it.

[preset.minimax]
name = "MiniMax"
category = "cloud"
base_url = "https://api.minimax.io/v1"
auth = "bearer"
docs_url = "https://platform.minimax.io/docs/api-reference/text-openai-api"
notes = "MiniMax OpenAI-compatible API (international endpoint)."
quirks = ["no_nullable_union_tool_schema", "strip_llama_samplers"]

[[preset.minimax.models]]
id = "MiniMax-M3"
type = "chat"
context = 1000000
price_in = 0.30
price_out = 1.20
recommended = true

[[preset.minimax.models]]
id = "MiniMax-M3.1-Flash"
type = "chat"
context = 1000000
price_in = 0.15
price_out = 0.60

