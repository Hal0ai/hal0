# Frozen copy of the seed profiles as they stood before the profile-centric
# conversion (ADR-0029). Read ONLY by hal0.config.migrations.profile_centric_frozen
# to work out what a slot launches before the conversion; never by the launch
# path. The live seeds (seed_profiles.toml) change shape with ADR-0029; this
# file must not change.
#
# [seed.*]    = seed_profiles.toml (virtual, overlaid from code at every load)
# [demoted.*] = the pruned seeds a profiles.toml may adopt on first reference
#               (hal0.profiles.ProfileCatalog._materialize_legacy)

[seed.chat]
flags = "-fa auto --jinja -b 2048 -ub 512"
mtp = false
intent = "Generic chat (fallback for unknown models)"
quant = ""

[seed.embedding]
flags = "--embedding -fa auto -b 8192 -ub 8192"
mtp = false
intent = "Pooled embeddings"
quant = ""

[seed.reranking]
flags = "--reranking -fa auto -b 8192 -ub 8192"
mtp = false
intent = "Reranking"
quant = ""

[seed.cpu-chat]
