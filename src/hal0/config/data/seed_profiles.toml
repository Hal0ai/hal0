# hal0 1.0 seeded profile catalog.
#
# Seeds are small, device-agnostic workload templates. Physical placement,
# GPU offload, CPU threads, runner binary, and image pins belong to slots.
# Model-family quirks belong in family_defaults.toml and per-model defaults.
# Backend-specific experiments are clone-only examples, not catalog seeds.
#
# `mtp` remains on the public profile shape for one release as informational
# compatibility metadata. It is not read by launch; model capability and the
# selected slot runner decide MTP.

[profile.chat]
flags = "-fa on"
mtp = false
device_class = "gpu"
intent = "General chat"
quant = ""

[profile.chat-long-context]
# Logical long-context tune; model-family defaults may override KV policy.
flags = "-fa on -ctk q8_0 -ctv q8_0 -b 2048 -ub 512 --parallel 1 --no-mmap --no-context-shift --poll 100 --poll-batch 1 --metrics --no-webui"
mtp = false
device_class = "gpu"
intent = "Long-context chat"
quant = ""

[profile.moe]
# FPX-MOE logical tune distilled from the validated Saber launch card.
# Hardware and MTP draft-device flags are deliberately slot/model-owned.
flags = "--jinja -c 32768 --reasoning off --reasoning-format none --reasoning-budget -1 --no-context-shift -fa on -b 2048 -ub 512 -tb 32 -ctk f16 -ctv f16 --temp 0 --top-p 0.95 --top-k 20 --seed 123 --parallel 1 --no-mmproj --metrics --no-webui --slot-prompt-similarity 0.0"
mtp = false
device_class = "gpu"
intent = "MoE chat · Saber tune"
quant = "ROCmFP4"

[profile.dense]
# FPX-DNSE logical tune distilled from the validated Chadrock launch card.
# The 131072 context target is a workload default; slots still own hardware.
flags = "--jinja -c 131072 --reasoning off --reasoning-format none --reasoning-budget -1 --no-context-shift -fa on -b 2048 -ub 512 -tb 32 -ctk q8_0 -ctv q8_0 --temp 0 --top-p 0.95 --top-k 20 --seed 123 --parallel 1 --no-mmproj --metrics --no-webui --slot-prompt-similarity 0.0"
mtp = false
device_class = "gpu"
intent = "Dense chat · long context"
quant = "ROCmFP4"

[profile.embedding]
flags = "--embedding -fa on -b 8192 -ub 8192 --no-mmap"
mtp = false
device_class = "gpu"
intent = "Embeddings"
quant = ""

[profile.reranking]
flags = "--reranking -fa on -b 8192 -ub 8192 --no-mmap"
mtp = false
device_class = "gpu"
intent = "Reranking"
quant = ""

[profile.cpu-chat]
# No --threads here: thread count is a slot hardware fact.
flags = "--threads-batch 8 -b 256 -ub 256 --parallel 1"
mtp = false
device_class = "cpu"
intent = "CPU chat"
quant = ""

[profile.flm]
flags = ""
mtp = false
device_class = "npu"
intent = "FLM"
quant = "W4ABF16"

[profile.kokoro]
flags = "--model_path /mnt/ai-models/local/kokoro-v1/kokoro-onnx"
mtp = false
device_class = "cpu"
intent = "Kokoro TTS"
quant = ""

[profile.qwen3-tts]
flags = "--model_path /mnt/ai-models/local/qwen3-tts/Qwen3-TTS-12Hz-1.7B-CustomVoice --default_voice Ryan --default_language Auto"
mtp = false
device_class = "gpu"
intent = "Qwen3-TTS"
quant = "BF16"

[profile.comfyui]
flags = "--disable-mmap --bf16-vae --cache-none"
mtp = false
device_class = "img"
intent = "ComfyUI"
quant = ""
