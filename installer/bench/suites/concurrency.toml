# suites/concurrency.toml — Tier C: server_ab --mode batch concurrency
# sweep on the agent-class slots. Operator/agent-invoked only, never on
# the weekly timer (schedule = "on-demand"). See the bench design handoff §4.

[suite]
id          = "concurrency"
description = "server_ab batch-mode concurrency sweep (np 1/2/4/8) on agent-class slots"
schedule    = "on-demand"    # run explicitly: hal0 bench run --suite concurrency
budget_min  = 240
exclusive   = true
priority    = 30

[selector]
# Operator-set, same reasoning as lane-matrix.toml: concurrency behavior
# is characterized on the agent-class slot(s), not the whole roster.
caps_any  = ["chat", "coder"]
installed = true

[matrix]
lanes    = ["default"]
depths   = [2048]
samplers = ["greedy"]
reps     = 3

[cells]
kinds = ["batch"]           # Tier C: server_ab --mode batch
np    = [1, 2, 4, 8]        # concurrency axis; part of the cell identity (config.parallel)

[staleness]
max_age_days = 30
