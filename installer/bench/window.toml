# suites/window.toml — NOT a suite: this is the scheduled-run politeness
# policy consulted by `hal0 bench run --scheduled` (the mode the weekly
# timer, hal0-bench.timer, invokes). It lives alongside the suite
# TOMLs because it's the other half of "set and forget": suites say WHAT
# to measure, this file says WHEN it's polite to actually touch the GPU.
# See docs/archive/handoffs/benchmark-system-design-2026-07-05.md §6.
#
# Politeness policy (applies ONLY to `--scheduled`; a manual
# `hal0 bench run --suite X` bypasses this file entirely and runs now):
#
#   (a) the current time must fall inside [window] below (default
#       Sun 03:00-07:00 local time on the box);
#   (b) hal0-api's throughput history must show no active /v1/* traffic
#       for at least `min_idle_min` trailing minutes.
#
# If ANY check fails, the run exits 0 and does nothing. The next timer
# tick retries — hal0-bench.timer sets Persistent=true, so a tick
# missed entirely (box off/rebooting through the window) still catches
# up, and the politeness checks above re-apply when it does. A skipped
# week is fine; a corrupted-numbers week (benchmarking while the box is
# doing real work) is not.

[window]
day   = "Sun"
start = "03:00"
end   = "07:00"
tz    = "local"

[politeness]
min_idle_min = 10    # no /v1/* traffic in this many trailing minutes
