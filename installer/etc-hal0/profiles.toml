# hal0 profile catalog — OPERATOR CUSTOM PROFILES ONLY.
#
# Seed profiles are VIRTUAL: the built-in catalog (rocm / rocm-dnse / rocm-moe /
# vulkan / cuda / embed / rerank / flm / tts / tts-qwen3 / cpu-llm / comfyui)
# lives in code (SEED_PROFILES in hal0.config.schema) and is overlaid on every
# load. It is intentionally NOT materialised here so that a re-tuned seed — new
# flags, a bumped toolbox image — reaches every install on upgrade instead of
# being frozen by a stale on-disk copy. hal0-api serves the seeds from code
# whether or not this file exists.
#
# What this file is for: your OWN profiles. Add `[profile.<name>]` tables below
# (or clone a seed from the dashboard, which writes here). Seed profiles are
# immutable — to customise one, clone it under a new name. hal0 persists only
# non-seed profiles to /etc/hal0/profiles.toml; any seed key written here is
# ignored in favour of the code definition and pruned on the next save/upgrade.
#
# A profile = (image, flags, mtp, device_class, backend). Slots reference a
# profile by name; the profile supplies the container image + flag bundle and
# the GPU runtime (backend = rocm|vulkan|cuda). See the container-runtime design
# doc (§1) for the layering rationale.
#
# Example — a custom ROCm profile cloned from `rocm-moe`:
#
#   [profile.my-moe]
#   image        = "ghcr.io/hal0ai/amd-strix-halo-toolboxes:rocm-7.2.4-rocmfp4-server"
#   flags        = "-fa on -ctk q8_0 -ctv q8_0 -b 8192 -ub 2048 --parallel 1 --threads 16 --no-mmap --jinja"
#   mtp          = true
#   device_class = "gpu"
#   backend      = "rocm"
#   cloned_from  = "rocm-moe"
