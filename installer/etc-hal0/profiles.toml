# hal0 profile catalog — OPERATOR CUSTOM PROFILES ONLY.
#
# Seed profiles are VIRTUAL: the built-in catalog (chat / chat-long-context /
# embedding / reranking / cpu-chat / flm / kokoro / qwen3-tts / comfyui)
# lives in code
# (SEED_PROFILES in hal0.config.schema) and is overlaid on every
# load. It is intentionally NOT materialised here so that a re-tuned seed — new
# flags, a bumped toolbox image — reaches every install on upgrade instead of
# being frozen by a stale on-disk copy. hal0-api serves the seeds from code
# whether or not this file exists.
#
# What this file is for: your OWN profiles. Add `[profile.<name>]` tables below
# (or clone a seed from the dashboard, which writes here). Seed profiles are
# immutable — to customise one, clone it under a new name. hal0 persists only
# non-seed profiles to /etc/hal0/profiles.toml; any seed key written here is
# ignored in favour of the code definition and pruned on the next save/upgrade.
#
# A profile = (flags, mtp, runtime-family metadata). Slots reference a
# profile by name; the slot supplies hardware, runner binary, and image. See
# the container-runtime design
# doc (§1) for the layering rationale. NOTE (§7.1a / ML-5): `mtp` here is
# informational only — MTP and --jinja are now MODEL/runner capabilities, not
# profile tunes; see ModelDefaults.mtp / .jinja in hal0.registry.model.
#
# Example — a custom workload profile cloned from `chat-long-context`:
#
#   [profile.my-moe]
#   flags        = "-fa on -ctk q8_0 -ctv q8_0 -b 8192 -ub 2048 --parallel 1 --no-mmap"
#   mtp          = false
#   device_class = "gpu"
#   cloned_from  = "chat-long-context"
