# Embed slot — pooled embeddings in a podman container (hal0-slot@embed).
# Port 8083 per setup_command._SETUP_SLOTS["embed"]. Rerank slot uses
# 8086 (per the rerank.toml port-drift fix in §5.4).
#
# profile = embedding (existing in catalog): pooled embeddings tune
# (--embedding -fa auto -b 8192 -ub 8192). The slot can bind any
# embedding-capable model (nomic-embed, qwen3-embedding-0-6b-q8-0,
# bge-base-en-v1.5-q4_k_m, etc.).
#
# Clean seed (WS-E, #1107): no `[model].default` pin, so a model-less box
# boots a GREY tile. The operator assigns an embed model later; filling in
# `[model].default` is what activates the slot (#1369).
name = "embed"
type = "embedding"
# gpu-rocm, not gpu-vulkan — a preference now, not a prohibition.
# #1888 made it a prohibition: llama.cpp slots launch one runner image on
# both GPU devices, and that image's Vulkan backend emitted invalid tokens
# for every model, so gpu-vulkan named a lane no slot could validly run.
# #1948 fixed the image and Vulkan is a supported lane again.
#
# ROCm stays the SEEDED default, but not on speed: on the reference
# hardware the Vulkan lane measures FASTER on both metrics (#1948 §3-C,
# ct150: +13.96% prefill, +20.45% decode). It is seeded because it is the
# lane with the validation history behind it and the one MTP/speculative
# decode is tuned on. The seeded default is revisited at GA against a
# broader matrix.
#
# Requires /dev/kfd (installer preflight + load-time guard). On a box
# without it this slot derives gpu-vulkan instead. To switch deliberately:
#   hal0 slot edit <slot> --hardware vulkan
# or use the Device picker in the dashboard's slot drawer.
device = "gpu-rocm"
runtime = "container"
profile = "embedding"
port = 8083
n_gpu_layers = -1
threads = 0

[model]
context_size = 4096
