# Rerank slot — llama-server --reranking in a podman container (hal0-slot@rerank).
#
# Clean seed (WS-E, #1107): no `[model].default` pin, so a model-less box
# boots a GREY tile (no surprise download, no crash-loop). The operator picks
# a reranker later; filling in `[model].default` activates it (#1369).
# device/profile are the supported GPU-ROCm tile defaults — the
# guided / answer-file setup path derives them from the up-front preflight
# (hardware.json, #1097).
#
# Per spec §5.4: port drift fix. Was 8083 (which conflicted with
# _SETUP_SLOTS["embed"] = 8083); now 8086 per _SETUP_SLOTS["rerank"].
# Existing installs keep their old port (seeds never overwrite).
name = "rerank"
type = "reranking"
# gpu-rocm, not gpu-vulkan — a preference now, not a prohibition.
# #1888 made it a prohibition: llama.cpp slots launch one runner image on
# both GPU devices, and that image's Vulkan backend emitted invalid tokens
# for every model, so gpu-vulkan named a lane no slot could validly run.
# #1948 fixed the image and the Vulkan lane is offered again — but ROCm
# stays the seeded default because it is the faster lane on the reference
# hardware (notably prefill). Requires /dev/kfd (preflight + load-time
# guard); on a box without it, switch this slot to gpu-vulkan.
device = "gpu-rocm"
runtime = "container"
profile = "reranking"
port = 8086
n_gpu_layers = -1
threads = 0

[model]
context_size = 4096
