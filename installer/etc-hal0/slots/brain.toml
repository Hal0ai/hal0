# Brain LLM slot — vulkan llama-server container (hal0-slot@brain).
#
# The dashboard's sidebar agent chat (the hal0-brain platform steward)
# targets the virtual model `hal0/brain`, which resolves here once a model
# is bound and falls back to the `agent` slot meanwhile. Seeding the slot
# makes that intent visible as a grey tile instead of the chat's model
# routing failing opaquely on fresh boxes.
#
# install.sh copies this file into /etc/hal0/slots/ BEFORE the first-run
# scaffold pass, so these curated values win over the generic derived
# scaffold the seeding step would otherwise write (it skips any slot whose
# config already exists). Never overwrites an existing file.
#
# WHO SETS [model].default — read before adding one back here.
# The brain is the platform steward: unlike a normal user slot it must WORK
# out of the box. So install.sh PULLS its weights during the install
# ("Brain model" step → `python -m hal0.install.brain_model`) and stamps
# `[model].default` only once the bytes have landed. That is why no
# `[model].default` is hardcoded below:
#
#   * The right variant is hardware-dependent. All three live in the public
#     repo Hal0ai/hal0-brain-sft-ROCmFPX-GGUF, but the Q8/Q4 builds carry
#     CUSTOM GGML tensor type ids (103 / 100) that STOCK llama.cpp REJECTS —
#     they need the ROCmFPX runner. A GPU box gets the small, fast
#     `hal0-brain-sft-q8-rocmfpx` (agent/tool-use preset); a box with no
#     ROCm/Vulkan device gets the portable `hal0-brain-sft-f16`. Pinning
#     either one here would crash-loop the other kind of box.
#   * Model-presence IS the activation signal (#1369), so an id written
#     before the file exists on disk is precisely the start-before-model
#     race (#1108). If the pull cannot happen (no network, no space) the
#     slot stays model-less and the install still succeeds — a grey tile,
#     not a crash loop.
#
# WHAT REPLACED WHAT — the previous seed pinned `MiniCPM5-1B-Agentic-Tooluse`.
# That is a REAL, PULLABLE model: the public GGUF repack of the upstream
# tool-use base at ewinregirgojr/MiniCPM5-1B-Agentic-Tooluse-GGUF
# (`...Nemotron-DPO.F16.gguf`, 2,166,552,576 B, anonymous read). Moving to the
# `Hal0ai/hal0-brain-sft-ROCmFPX-GGUF` variants is an UPGRADE, not a repair:
# from the upstream base in F16-only, to hal0's own SFT with quants matched to
# the detected hardware. Two caveats the old pin still had, and which are why
# the id does not simply stay here:
#   * it is not in the SHIPPED curated catalogue (registry/curated.py), so a
#     fresh box has no coordinates for it until something scans or adds it —
#     it resolves on boxes whose registry already carries the row, not on a
#     box straight out of install.sh;
#   * it is F16-only, so a ROCmFPX box gets no benefit from the quants.
#
# Port 8089: 8088 belongs to the flm seed.
#
# Tool calling: as of runner ade07ba (DEFAULT_ROCMFPX_IMAGE) the brain
# models are NATIVE tool-callers — llama.cpp's MiniCPM5 specialized parser
# preserves the vocab's tool-syntax control tokens and grammar-locks the
# call shape, so the steward executes its own calls on this slot (verified
# live on both the SFT quants and the MiniCPM5 base). The `[brain_chat]
# tool_model` reroute (default `hal0/agent`, ADR-0023) remains as the
# FALLBACK: it catches artefact rounds and covers older runner images or
# off-dialect models, and the tool-capable model still owns a chain's
# continuation rounds. Point `[brain_chat] model` elsewhere only if you
# deliberately want a bigger steward voice.
name = "brain"
type = "llm"
device = "gpu-vulkan"
runtime = "container"
profile = "brain"
port = 8089
n_gpu_layers = -1
threads = 0

[model]
context_size = 65536
