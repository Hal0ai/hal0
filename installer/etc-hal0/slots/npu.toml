# NPU LLM slot — FastFlowLM in a podman container (hal0-slot@npu).
# Chat-first NPU seed: the slot is `device="npu"` and defaults `chat=true`
# (the FLM container's chat edge). The trio (asr/embed) stays OFF and no
# FLM model is pinned so a fresh, deliberately model-less box boots a GREY
# tile — no surprise multi-GB FLM download and no crash-loop. The operator
# assigns a model later (dashboard / `hal0 setup` / `hal0 slot npu edit`),
# which flips `enabled`.
#
# The `chat = true` default (NpuConfig.chat) gives the slot a chat path out
# of the box; operators opt out by setting `chat = false` in [npu] when
# they want an asr-only or embed-only NPU slot.
#
# v0.9.5+ — added alongside the slot.image override work so the slot
# container pulls the canonical `:vulkan-minicpm5` image directly.
#
# To flip the FLM trio on, drop a `[npu]` table next to [model] with
# `asr = true` and/or `embed = true` (chat defaults to on):
#
#   [npu]
#   asr = true
#   embed = true
#
name = "npu"
type = "llm"
runtime = "container"
profile = "flm"
device = "npu"
port = 8088
enabled = false

[model]
context_size = 16384