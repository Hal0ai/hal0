# Utility LLM slot — vulkan llama-server container (hal0-slot@utility).
#
# Clean seed (WS-E, #1107): ships WITHOUT a `[model].default`, so a fresh,
# deliberately model-less box boots a GREY tile — no surprise multi-GB download
# and no crash-loop. Filling in `[model].default` is what activates it (#1369).
# The previous pin was the GHOST id `gemma-4-12b-it`:
# a catalog/marketing id with NO registry file and NO curated coords (the real
# GGUF is `gemma-4-12b-it-ud-q4-k-xl` → `unsloth/gemma-4-12b-it-GGUF`). Pinned to
# the ghost on a box with nothing to fall back to, the slot crash-looped.
#
# The operator assigns a model later (from the dashboard); filling in
# `[model].default` activates it. profile = chat (generic workload template)
# lets any chat-capable model bind here without needing a family-specific
# profile pick.
name = "utility"
type = "llm"
# gpu-rocm, not gpu-vulkan — a preference now, not a prohibition.
# #1888 made it a prohibition: llama.cpp slots launch one runner image on
# both GPU devices, and that image's Vulkan backend emitted invalid tokens
# for every model, so gpu-vulkan named a lane no slot could validly run.
# #1948 fixed the image and Vulkan is a supported lane again.
#
# ROCm stays the SEEDED default, but not on speed: on the reference
# hardware the Vulkan lane measures FASTER on both metrics (#1948 §3-C,
# ct150: +13.96% prefill, +20.45% decode). It is seeded because it is the
# lane with the validation history behind it and the one MTP/speculative
# decode is tuned on. The seeded default is revisited at GA against a
# broader matrix.
#
# Requires /dev/kfd (installer preflight + load-time guard). On a box
# without it this slot derives gpu-vulkan instead. To switch deliberately:
#   hal0 slot edit <slot> --hardware vulkan
# or use the Device picker in the dashboard's slot drawer.
device = "gpu-rocm"
runtime = "container"
profile = "chat"
# Port 8090: 8081 is the `agent` seed's canonical primary port (ADR-0023);
# existing installs keep whatever their file says (seeds never overwrite).
port = 8090
n_gpu_layers = -1
threads = 0

[model]
context_size = 65536
