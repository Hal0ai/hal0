# Utility LLM slot — vulkan llama-server container (hal0-slot@utility).
#
# Clean seed (WS-E, #1107): ships WITHOUT a `[model].default`, so a fresh,
# deliberately model-less box boots a GREY tile — no surprise multi-GB download
# and no crash-loop. Filling in `[model].default` is what activates it (#1369).
# The previous pin was the GHOST id `gemma-4-12b-it`:
# a catalog/marketing id with NO registry file and NO curated coords (the real
# GGUF is `gemma-4-12b-it-ud-q4-k-xl` → `unsloth/gemma-4-12b-it-GGUF`). Pinned to
# the ghost on a box with nothing to fall back to, the slot crash-looped.
#
# The operator assigns a model later (from the dashboard); filling in
# `[model].default` activates it. profile = chat (generic workload template)
# lets any chat-capable model bind here without needing a family-specific
# profile pick.
name = "utility"
type = "llm"
# #1888: gpu-rocm, not gpu-vulkan. llama.cpp slots launch the unified
# ROCmFPX runner on both GPU devices; that image's Vulkan backend emits
# invalid tokens for every model, so gpu-vulkan named a lane no slot
# could validly run. Requires /dev/kfd (preflight + load-time guard).
device = "gpu-rocm"
runtime = "container"
profile = "chat"
# Port 8090: 8081 is the `agent` seed's canonical primary port (ADR-0023);
# existing installs keep whatever their file says (seeds never overwrite).
port = 8090
n_gpu_layers = -1
threads = 0

[model]
context_size = 65536
