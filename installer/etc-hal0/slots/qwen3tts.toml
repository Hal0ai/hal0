# Qwen3-TTS slot — multilingual GPU TTS in a podman container
# (hal0-slot@qwen3tts). The GPU sibling of the cpu `tts`/kokoro slot; both
# implement the OpenAI /v1/audio/speech contract.
#
# Per spec §5.4: this file was previously an opt-in template (NOT in the
# installer's STATIC_SEED_SLOTS loop). For 1.0 it becomes a real static
# seed — adds to STATIC_SEED_SLOTS tuple + install.sh:1666 loop + the
# spec §5.1 mapping table. Like other seeds it ships with no
# `[model].default` pin (the activation signal, #1369), so copying it in never
# triggers a surprise download or a crash-loop.
name = "qwen3tts"
type = "tts"
# gpu-rocm is a contract, not a preference (#2067): the Qwen3-TTS image is a
# ROCm-only build (RUNNER_IMAGES["qwen3tts"].supported_backends == ("rocm",)),
# so seeding never derives another device — there is no CPU or Vulkan lane to
# derive; the cpu `tts`/kokoro sibling above IS the CPU speech lane. On a
# kfd-less box this seeds as an inactive tile and first use refuses loudly,
# naming the absent /dev/kfd and how to forward it.
device = "gpu-rocm"
runtime = "container"
profile = "qwen3-tts"
port = 8095
n_gpu_layers = -1
threads = 0
