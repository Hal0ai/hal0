# Coder slot — code-gen workload in a podman container (hal0-slot@coder).
# Port 8082 per setup_command._SETUP_SLOTS["coder"]. Sibling to the
# agent slot (8081); used by the codegen virtual model hal0/code
# (per brain.toml docstring: "hal0/code (27B coder, lighter)").
#
# profile = coding (new in 1.0; per spec §4.2): workload-level code-gen
# tune — higher temp for code-gen creativity, no reasoning (coders are
# non-reasoning), specific sampler (--temp 0.7 --top-p 0.95 --top-k 40).
# Family-specific overrides go in profile.<family>-coding for specific
# coder model families (e.g. profile.qwopus-coding) — out of scope for 1.0.
#
# Clean seed (WS-E, #1107): no `[model].default` pin, so a model-less box
# boots a GREY tile. The operator assigns a coder model later; filling in
# `[model].default` is what activates the slot (#1369).
name = "coder"
type = "llm"
# gpu-rocm, not gpu-vulkan — a preference now, not a prohibition.
# #1888 made it a prohibition: llama.cpp slots launch one runner image on
# both GPU devices, and that image's Vulkan backend emitted invalid tokens
# for every model, so gpu-vulkan named a lane no slot could validly run.
# #1948 fixed the image and the Vulkan lane is offered again — but ROCm
# stays the seeded default because it is the faster lane on the reference
# hardware (notably prefill). Requires /dev/kfd (preflight + load-time
# guard); on a box without it, switch this slot to gpu-vulkan.
device = "gpu-rocm"
runtime = "container"
profile = "coding"
port = 8082
n_gpu_layers = -1
threads = 0

[model]
context_size = 32768
