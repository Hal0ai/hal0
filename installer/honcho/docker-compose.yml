# Honcho Docker Compose — vendored from plastic-labs/honcho v3.0.9
# (docker-compose.yml.example), adapted for hal0 packaging. See
# installer/honcho/README.md for provenance/upgrade notes.
#
# Deltas from upstream:
#   - `ports:` stripped from database + redis entirely. Port 5432 on this
#     box is already taken by Hindsight's embedded pg0 postgres; both
#     services are compose-network-internal only (api/deriver reach them
#     by service name — no host exposure needed).
#   - api + deriver get extra_hosts: host.docker.internal -> host-gateway
#     so they can reach hal0-api's OpenAI-compatible LLM endpoint on the
#     HOST at :8080 from inside the container.
#   - Named volumes replaced with bind mounts under /var/lib/hal0/honcho/
#     (installer-owned data root — see hal0-honcho.service).
#   - build context points at the pinned upstream clone the installer
#     makes at /var/lib/hal0/honcho/src.
#   - dev source-mount comments and the commented monitoring stack
#     (prometheus/grafana) dropped — not part of the managed deployment.
#
# Managed by installer/install.sh (opt-in: HAL0_INSTALL_HONCHO=1) and run
# via installer/systemd/hal0-honcho.service.

name: hal0-honcho

services:
  api:
    # Image is pre-built by the installer via `podman build` (BuildKit RUN
    # steps hit the LXC AppArmor wall under docker); `build:` is kept as a
    # fallback reference. hal0-honcho.service runs `up --no-build`.
    image: localhost/hal0-honcho:main-73453f8
    build:
      context: /var/lib/hal0/honcho/src
      dockerfile: Dockerfile
    entrypoint: ["sh", "docker/entrypoint.sh"]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # CMD-SHELL (not a CMD array): podman's healthcheck runner word-splits
      # array args, mangling the python -c payload into a SyntaxError.
      test:
        [
          "CMD-SHELL",
          "/app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://postgres:postgres@database:5432/postgres
      - CACHE_URL=redis://redis:6379/0?suppress=true
      - CACHE_ENABLED=true
    env_file:
      - path: /etc/hal0/honcho.env
        required: false
    restart: unless-stopped
    # Docker-in-LXC: the docker-default AppArmor profile cannot be loaded
    # inside an unprivileged LXC (apparmor_parser needs policy-admin), so
    # every service runs unconfined — same workaround as the box's other
    # docker/podman services (e.g. karakeep, openwebui).
    security_opt:
      - apparmor:unconfined

  deriver:
    # Image is pre-built by the installer via `podman build` (BuildKit RUN
    # steps hit the LXC AppArmor wall under docker); `build:` is kept as a
    # fallback reference. hal0-honcho.service runs `up --no-build`.
    image: localhost/hal0-honcho:main-73453f8
    build:
      context: /var/lib/hal0/honcho/src
      dockerfile: Dockerfile
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    depends_on:
      api:
        condition: service_healthy
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://postgres:postgres@database:5432/postgres
      - CACHE_URL=redis://redis:6379/0?suppress=true
      - CACHE_ENABLED=true
    env_file:
      - path: /etc/hal0/honcho.env
        required: false
    restart: unless-stopped
    # Docker-in-LXC: the docker-default AppArmor profile cannot be loaded
    # inside an unprivileged LXC (apparmor_parser needs policy-admin), so
    # every service runs unconfined — same workaround as the box's other
    # docker/podman services (e.g. karakeep, openwebui).
    security_opt:
      - apparmor:unconfined

  database:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    # Docker-in-LXC: the docker-default AppArmor profile cannot be loaded
    # inside an unprivileged LXC (apparmor_parser needs policy-admin), so
    # every service runs unconfined — same workaround as the box's other
    # docker/podman services (e.g. karakeep, openwebui).
    security_opt:
      - apparmor:unconfined
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      # No host port is published (compose-internal network only), so the
      # trust auth method upstream ships for local tooling is moot here —
      # kept only because api/deriver's DB_CONNECTION_URI still carries the
      # postgres:postgres credential pair.
      - POSTGRES_HOST_AUTH_METHOD=trust
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - /var/lib/hal0/honcho/src/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - /var/lib/hal0/honcho/pgdata:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2
    restart: unless-stopped
    # Docker-in-LXC: the docker-default AppArmor profile cannot be loaded
    # inside an unprivileged LXC (apparmor_parser needs policy-admin), so
    # every service runs unconfined — same workaround as the box's other
    # docker/podman services (e.g. karakeep, openwebui).
    security_opt:
      - apparmor:unconfined
    volumes:
      - /var/lib/hal0/honcho/redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
