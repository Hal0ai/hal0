name: Playwright (γ)

# Critical-path UI tests — PLAN §10.3, ~8 min budget.
# Runs against the Vite dev server with all /api/* endpoints
# mocked via page.route. Live-backend runs (HAL0_E2E_LIVE=1) are
# release-gate only and live in release-test.yml, not here.
#
# The suite runs as 4 shards on 4 runners (one ~15-minute runner became four
# ~4-minute ones), and one summary job carries the required check name
# "γ-suite (chromium)" so branch protection is unchanged. A pull request that
# touches nothing under ui/ skips the shards; the summary still reports.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs (the 8-12 min γ-suite is the priciest PR check).
# Push-to-main runs get one group per commit so a newer push can neither cancel
# nor replace a pending run: it's a required check + nightly gate input (#2429).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.classify.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Does the diff touch the UI?
        id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Classify from the MERGE BASE, not from base.sha. base.sha is the tip
          # of the base branch at event time and is NOT an ancestor of the PR
          # head, so a two-dot diff also lists every file the base changed
          # after the branch point — a backend-only PR was classified as a UI
          # change and the γ shards ran on it (#3469). The merge base is the
          # diff the PR actually introduces; fetch-depth: 0 above guarantees
          # it is available locally.
          MERGE_BASE="$(git merge-base "${BASE}" "${HEAD}" || echo "${BASE}")"
          echo "merge base: ${MERGE_BASE}"
          if git diff --name-only "${MERGE_BASE}" "${HEAD}" | grep -qE '^(ui/|\.github/workflows/playwright\.yml$)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no ui/ change — γ shards skipped, summary reports."
          fi

  shards:
    name: γ-shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.ui == 'true') }}
    # The shards run inside Microsoft's Playwright image, which ships Chromium
    # AND its system libraries already installed. That removes the per-shard
    # `npx playwright install-deps chromium` (an apt download) that ran on
    # every shard even on a browser-cache hit: in run 42058966113 that one
    # step took 11m53s on a stalled Ubuntu mirror and shard 4/4 was then
    # cancelled at the 15-minute job limit before a single test ran, so the
    # required check failed on a cancelled shard, not on an assertion
    # (#3469). The image tag is pinned to the @playwright/test version in
    # ui/package-lock.json and must be bumped with it — the check below
    # fails the shard if the two ever drift apart.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # Chromium needs the host IPC namespace or it can run out of shared
      # memory and crash (Playwright's own Docker guidance).
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Runner variance is extreme: the unsharded 658-spec suite completed green
    # in 7m24s and was cancelled mid-run at 18m19s on one PR (#1926). A shard
    # is a quarter of the suite, so the bound only has to cover the shard's
    # own tests plus a cold image pull and a cold `npm ci`. 30 leaves margin
    # for both while still bounding a genuinely wedged runner.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
        # A container job's default shell is `sh`, where `set -o pipefail` is
        # an illegal option. The image ships bash.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: The browser image must match the locked @playwright/test
        run: |
          set -euo pipefail
          LOCKED="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          if ! grep -qF "mcr.microsoft.com/playwright:v${LOCKED}-noble" ../.github/workflows/playwright.yml; then
            echo "::error::ui/package-lock.json pins @playwright/test ${LOCKED} but the shards do not run in mcr.microsoft.com/playwright:v${LOCKED}-noble — bump the image tag with the lockfile."
            exit 1
          fi

      - name: Run γ tests (shard ${{ matrix.shard }} of 4)
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          CI: "true"

      - name: Upload Playwright report (failures only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: ui/playwright-report/
          retention-days: 7

      - name: Upload test-results (failures only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard }}
          path: ui/test-results/
          retention-days: 7

  # The one check branch protection requires. Green when every shard passed,
  # or when the shards were skipped for a PR with no ui/ change; red when any
  # shard failed, timed out or was cancelled.
  e2e:
    name: γ-suite (chromium)
    runs-on: ubuntu-latest
    needs: [changes, shards]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Summarise the shards
        env:
          RESULT: ${{ needs.shards.result }}
        run: |
          echo "shards: ${RESULT}"
          case "${RESULT}" in
            success|skipped) exit 0 ;;
            *) echo "::error::γ-suite failed: shards result is '${RESULT}'"; exit 1 ;;
          esac
