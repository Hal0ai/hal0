name: Playwright (γ)

# Critical-path UI tests — PLAN §10.3, ~8 min budget.
# Runs against the Vite dev server with all /api/* endpoints
# mocked via page.route. Live-backend runs (HAL0_E2E_LIVE=1) are
# release-gate only and live in release-test.yml, not here.
#
# The suite runs as 4 shards on 4 runners (one ~15-minute runner became four
# ~4-minute ones), and one summary job carries the required check name
# "γ-suite (chromium)" so branch protection is unchanged. A pull request that
# touches nothing under ui/ skips the shards; the summary still reports.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs (the 8-12 min γ-suite is the priciest PR check).
# Push-to-main runs get one group per commit so a newer push can neither cancel
# nor replace a pending run: it's a required check + nightly gate input (#2429).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.classify.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Does the diff touch the UI?
        id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "${BASE}" "${HEAD}" | grep -qE '^(ui/|\.github/workflows/playwright\.yml$)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no ui/ change — γ shards skipped, summary reports."
          fi

  shards:
    name: γ-shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.ui == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Runner variance is extreme: the unsharded 658-spec suite completed green
    # in 7m24s and was cancelled mid-run at 18m19s on one PR (#1926). A shard
    # is a quarter of the suite; 15 bounds a genuinely wedged runner.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cache the Playwright browser binaries by package-lock hash so we
      # avoid the ~250 MB Chromium download on every PR.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/package-lock.json') }}

      - name: Install Chromium (only on cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps (always — needed even when browser is cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run γ tests (shard ${{ matrix.shard }} of 4)
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          CI: "true"

      - name: Upload Playwright report (failures only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: ui/playwright-report/
          retention-days: 7

      - name: Upload test-results (failures only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard }}
          path: ui/test-results/
          retention-days: 7

  # The one check branch protection requires. Green when every shard passed,
  # or when the shards were skipped for a PR with no ui/ change; red when any
  # shard failed, timed out or was cancelled.
  e2e:
    name: γ-suite (chromium)
    runs-on: ubuntu-latest
    needs: [changes, shards]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Summarise the shards
        env:
          RESULT: ${{ needs.shards.result }}
        run: |
          echo "shards: ${RESULT}"
          case "${RESULT}" in
            success|skipped) exit 0 ;;
            *) echo "::error::γ-suite failed: shards result is '${RESULT}'"; exit 1 ;;
          esac
