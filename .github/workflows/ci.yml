name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs to save runners. Push-to-main runs get one group
# per commit, so no run for a main commit is ever queued behind, replaced by,
# or cancelled by a newer push (every main commit must build: required checks
# + the nightly greenness gate). A shared per-ref group is not enough:
# cancel-in-progress: false still lets GitHub drop a *pending* run when a newer
# one queues in the same group (#2429).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  # Rework de-scar guardrail (stdlib-only, fast): overdue HAL0-SUNSET shims +
  # scar-marker ratchet. Every de-scar PR keeps this green (baseline only falls).
  sunset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sunset-shim + scar-ratchet guardrail
        run: python scripts/check_sunset.py

  python:
    runs-on: ubuntu-latest
    # The ~13k-test suite runs across 4 xdist workers (#2341); serially it had
    # grown to ~30 min quiet and 38-45+ min under --cov on 3.12, which hit
    # this cap. The bound exists because an infra stall (a 41-minute apt-get
    # hang on #1915, see #1927) would otherwise run to GitHub's 6-hour
    # default. 45 covers the parallel suite plus slow-runner margin.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # PRs test 3.12 (the floor) and 3.14 (what Ubuntu 26.04 installs run);
        # both are blocking, matching the required "python (3.12)" and
        # "python (3.14)" status checks. Pushes to main also run 3.13 so the
        # full supported range still gates the protected branch.
        python-version: ${{ (github.event_name == 'pull_request' && fromJSON('["3.12","3.14"]')) || fromJSON('["3.12","3.13","3.14"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install uv
        # Via pip on the setup-python interpreter — no third-party action tag
        # to chase (astral-sh/setup-uv@v8 didn't resolve and bricked the job).
        run: pip install uv
      - name: Install
        # --locked: fail if uv.lock has drifted from pyproject.toml, so CI
        # installs the exact pinned versions — the same ones a local
        # `uv sync` venv gets. (--frozen does NOT check: it installs from
        # the lock as-is and ignores pyproject.toml drift, #3043.) Fixes CI
        # pip-installing newer floating deps (FastAPI/Pydantic) that local
        # venvs never see.
        # --python pins the venv to the matrix interpreter setup-python laid
        # down, so uv can't silently pick a different system python.
        run: uv sync --locked --extra dev --python "$(which python)"
      - name: Lint
        run: uv run ruff check src tests
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Test
        # -n 4: pytest-xdist workers (ubuntu-latest has 4 vCPUs); pytest-cov
        # combines the per-worker coverage data (#2341).
        # Coverage (+ verbose) only on main pushes — it's a report, not a gate,
        # so PRs skip the instrumentation overhead and run a quiet, faster suite.
        # PRs also deselect the `podman` and `network` markers (pyproject.toml
        # [tool.pytest.ini_options]); main pushes (which gate the nightly) run them.
        run: uv run pytest tests/ -n 4 ${{ github.event_name == 'push' && '-v --cov=hal0 --cov-report=term-missing' || '-q -m "not podman and not network"' }}

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      # Runs BEFORE build: `vite build` transpiles per-file and never
      # type-checks across module boundaries, so a field renamed in one file
      # and still read in another builds green forever. That is exactly how
      # useRuntime.ts came to filter on a property the normaliser had already
      # renamed — a dead condition nothing could have caught here.
      - name: Typecheck
        run: npm run typecheck
      # The vitest suite (src/**/*.test.ts) existed but no workflow ran it, so
      # every unit test under ui/ was decorative — a passing local run gated
      # nothing. ~0.4s for 13 files; there is no reason not to gate on it.
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
