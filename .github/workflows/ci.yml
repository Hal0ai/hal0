name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs to save runners. Push-to-main runs get one group
# per commit, so no run for a main commit is ever queued behind, replaced by,
# or cancelled by a newer push (every main commit must build: required checks
# + the nightly greenness gate). A shared per-ref group is not enough:
# cancel-in-progress: false still lets GitHub drop a *pending* run when a newer
# one queues in the same group (#2429).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  # Fast lane for pull requests: decide which heavy jobs the diff actually
  # needs. A docs-only or ui-only PR skips the Python shards; the required
  # status checks still report through the `python` summary job (a workflow
  # skipped by a `paths:` filter would not report at all). The filter errs toward running: anything
  # outside `ui/`, `docs/` and prose files runs the full suite. Pushes to
  # main never skip (the nightly gate reads that run).
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    outputs:
      python: ${{ steps.classify.outputs.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify the diff
        id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Classify from the MERGE BASE, not from base.sha. base.sha is the tip
          # of the base branch at event time and is NOT an ancestor of the PR
          # head, so a two-dot diff also lists every file the base changed
          # after the branch point — a backend-only PR was classified as a UI
          # change and the γ shards ran on it (#3469). The merge base is the
          # diff the PR actually introduces; fetch-depth: 0 above guarantees
          # it is available locally.
          MERGE_BASE="$(git merge-base "${BASE}" "${HEAD}" || echo "${BASE}")"
          echo "merge base: ${MERGE_BASE}"
          FILES="$(git diff --name-only "${MERGE_BASE}" "${HEAD}")"
          echo "changed files:"; printf '  %s\n' ${FILES:-"(none)"}
          # Paths that cannot affect the Python package or its tests.
          LIGHT='^(ui/|docs/|screenshots/|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE\.md$|[^/]+\.md$|[^/]+\.mdx$|LICENSE$|CODEOWNERS$)'
          PY=false
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            if ! [[ "$f" =~ $LIGHT ]]; then PY=true; fi
          done <<< "${FILES}"
          echo "python=${PY}" >> "$GITHUB_OUTPUT"
          echo "::notice::python jobs needed: ${PY}"

  # Rework de-scar guardrail (stdlib-only, fast): overdue HAL0-SUNSET shims +
  # scar-marker ratchet. Every de-scar PR keeps this green (baseline only falls).
  sunset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sunset-shim + scar-ratchet guardrail
        run: python scripts/check_sunset.py

  # The Python suite (~31k tests) split across 4 runners per interpreter.
  # One runner took 17-18 minutes for a PR, which was the whole critical path
  # to a mergeable Python change; four shards bring that to about 6. Each shard
  # runs `--shard I/4` (tests/conftest.py): whole test files are dealt out by
  # test count, so every file runs in exactly one shard and module-scoped
  # fixtures stay together. The required status checks are
  # reported by the `python` summary job below, not by these shards.
  python-shard:
    name: py ${{ matrix.python-version }} shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    needs: [changes]
    # `!cancelled()` lets the job run even though `changes` itself is skipped
    # on pushes to main. On a PR whose diff cannot touch the package (see
    # `changes`) the shards are skipped and the summary job reports green.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.python == 'true') }}
    # A shard runs in about 5 minutes. The bound exists because an infra stall
    # (a 41-minute apt-get hang on #1915, see #1927) would otherwise run to
    # GitHub's 6-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PRs test 3.12 (the floor) and 3.14 (what Ubuntu 26.04 installs run).
        # Pushes to main also run 3.13 so the full supported range still gates
        # the protected branch.
        python-version: ${{ (github.event_name == 'pull_request' && fromJSON('["3.12","3.14"]')) || fromJSON('["3.12","3.13","3.14"]') }}
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install uv
        # Via pip on the setup-python interpreter — no third-party action tag
        # to chase (astral-sh/setup-uv@v8 didn't resolve and bricked the job).
        run: pip install uv
      - name: Install
        # --locked: fail if uv.lock has drifted from pyproject.toml, so CI
        # installs the exact pinned versions — the same ones a local
        # `uv sync` venv gets. (--frozen does NOT check: it installs from
        # the lock as-is and ignores pyproject.toml drift, #3043.) Fixes CI
        # pip-installing newer floating deps (FastAPI/Pydantic) that local
        # venvs never see.
        # --python pins the venv to the matrix interpreter setup-python laid
        # down, so uv can't silently pick a different system python.
        run: uv sync --locked --extra dev --python "$(which python)"
      # Lint and format are whole-tree checks: one shard per interpreter is enough.
      - if: ${{ matrix.shard == 1 }}
        name: Lint
        run: uv run ruff check src tests
      - if: ${{ matrix.shard == 1 }}
        name: Format check
        run: uv run ruff format --check src tests
      - name: Test
        # -n 4: pytest-xdist workers (ubuntu-latest has 4 vCPUs, #2341).
        # PRs deselect the `podman` and `network` markers (pyproject.toml
        # [tool.pytest.ini_options]); main pushes (which gate the nightly) run
        # them. No coverage: the report was printed on every main push, slowed
        # 3.12/3.13 several-fold under the settrace tracer, and nothing read it.
        run: uv run pytest tests/ -n 4 -q --durations=30 --shard ${{ matrix.shard }}/4 ${{ github.event_name == 'pull_request' && '-m "not podman and not network"' || '' }}

  # The checks branch protection requires: "python (3.12)" and "python (3.14)"
  # (plus "python (3.13)" on main). Green when every shard passed, or when the
  # shards were skipped for a PR that cannot touch the package; red when any
  # shard failed, timed out or was cancelled, or when the diff classifier
  # itself failed. A matrix job skipped by its own `if:` never creates its
  # contexts (#3148), so this job always runs.
  python:
    runs-on: ubuntu-latest
    needs: [changes, python-shard]
    if: always()
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ (github.event_name == 'pull_request' && fromJSON('["3.12","3.14"]')) || fromJSON('["3.12","3.13","3.14"]') }}
    steps:
      - name: Summarise the shards
        env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.python-shard.result }}
        run: |
          echo "changes: ${CHANGES}, shards: ${SHARDS}"
          case "${CHANGES}" in
            success|skipped) ;;
            *) echo "::error::diff classifier result is '${CHANGES}'"; exit 1 ;;
          esac
          case "${SHARDS}" in
            success|skipped) exit 0 ;;
            *) echo "::error::python suite failed: shards result is '${SHARDS}'"; exit 1 ;;
          esac

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      # Runs BEFORE build: `vite build` transpiles per-file and never
      # type-checks across module boundaries, so a field renamed in one file
      # and still read in another builds green forever. That is exactly how
      # useRuntime.ts came to filter on a property the normaliser had already
      # renamed — a dead condition nothing could have caught here.
      - name: Typecheck
        run: npm run typecheck
      # The vitest suite (src/**/*.test.ts) existed but no workflow ran it, so
      # every unit test under ui/ was decorative — a passing local run gated
      # nothing. ~0.4s for 13 files; there is no reason not to gate on it.
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
