version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must stay on the exact same version (React throws
      # "Incompatible React versions" otherwise), so they always move together,
      # majors included. Listed first: a dependency joins the first group it
      # matches.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      npm-minor-patch:
        update-types: [minor, patch]
        # The react group above did not stop this group from taking react on
        # its own (#2849 bumped react without react-dom), so exclude the react
        # packages here explicitly.
        exclude-patterns: [react, react-dom, "@types/react", "@types/react-dom"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: [minor, patch]
