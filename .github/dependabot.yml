version: 2
updates:
  # uv, not pip: CI installs with `uv sync --locked` (#3087), so a bump that
  # edits pyproject.toml without re-locking fails at install (#3176, #3177).
  # The uv ecosystem regenerates uv.lock in the same PR.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Deferred majors — each needs code changes, tracked in #2316.
      # Keep these here, not as `@dependabot ignore` PR comments: a comment
      # ignore is server-side state bound to this ecosystem block and is lost
      # when the block is renamed (see #3213 pip -> uv).
      - dependency-name: "mcp"
        versions: [">=2"]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must stay on the exact same version (React throws
      # "Incompatible React versions" otherwise), so they always move together,
      # majors included. Listed first: a dependency joins the first group it
      # matches.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      npm-minor-patch:
        update-types: [minor, patch]
        # The react group above did not stop this group from taking react on
        # its own (#2849 bumped react without react-dom), so exclude the react
        # packages here explicitly.
        exclude-patterns: [react, react-dom, "@types/react", "@types/react-dom"]
    ignore:
      # Deferred majors — each needs code changes, tracked in #2316.
      # vite 8 and @vitejs/plugin-react 6 land together (the plugin needs
      # Vite 7+). Keep these here, not as `@dependabot ignore` PR comments: a
      # comment ignore is server-side state bound to this ecosystem block and
      # is lost when the block is renamed (see #3213 pip -> uv).
      - dependency-name: "vite"
        versions: [">=8"]
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=6"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: [minor, patch]
