      hal0 slot list | grep brain      # poll until ready — did the load in fact succeed?
      # repeat for restart and unload
    expect: >-
      A load/unload/restart that succeeds exits 0. If the CLI cannot wait, it must poll and say
      so — never exit 1 on a successful operation.
    last_result: { release: v1.0.0-rc.6, result: fixed }
    rc6_note: >-
      Fixed: a failing load blocked 3m01s and exited 1 with the real server verdict; a
      successful load and unload exited 0. Exit status tracks the server-side outcome. Second
      consecutive mechanical pass shape — promote to release-test.sh and delete.

