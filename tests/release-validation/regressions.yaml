  - id: agents-bank-boot-writes-lost
    issue: 1897   # filed by rc.6 fix wave
    from: v1.0.0-rc.6
    severity: minor
    tier: judgment
    lane: memory
    summary: >-
      hal0-api's install-time boot runs the agents-dataset seeding while hindsight is still
      cold-starting, so the identity-card writes land in the in-memory pgvector fallback
      ("VOLATILE and will be LOST"), and the #1613 runtime self-heal swaps the provider without
      replaying them — the durable `agents` bank does not exist until some later hal0-api
      restart re-runs brain_lane against a healthy engine. Generalised defect: writes issued by
      hal0-api's own boot phases during the degraded-provider window are silently lost and never
      re-issued after provider_healed. Even after the bank appears, `hal0 agent peers` can stay
      empty because the card retains are stuck in extraction (that half is
      hindsight-extraction-shares-utility-slot / #1834). Spin-off found while cross-checking,
      worth its own small issue: `hal0 agent peers` on ct150 crashes with AttributeError at
      agent_commands.py:1372 when a card's hal0_state comes back as a JSON string.
    repro: |
      # On a fresh install, before any manual restart:
      curl -s $API/api/memory/banks | jq '.[] | {bank_id, created_at}'   # agents absent = defect
      journalctl -u hal0-api | grep -E 'boot_degraded|degraded_write|provider_healed'
      # then: systemctl restart hal0-api; the bank appears (created lazily by the re-run write)
    expect: >-
      The agents bank exists with created_at ~= install time on a fresh box, OR the heal path
      re-runs the (idempotent) brain_lane card publishes from the provider_healed branch. A
      degraded-window boot write lost with no journal warning, or the bank still missing after
      a restart with a durable provider, is the hard fail.

  - id: container-health-readerror-unhandled
    issue: 1898   # filed by rc.6 fix wave
    from: v1.0.0-rc.6
    severity: minor
    tier: mechanical
    lane: slots
    promote_ready: true
    summary: >-
