  - id: slot-capacity-vram-attribution
    issue: 1839
    from: v1.0.0-rc.5
    severity: minor
    tier: mechanical
    lane: slots
    promote_ready: true
    summary: >-
      `hal0 slot capacity` books a slot's memory to VRAM purely from its configured `device`,
      never consulting whether a usable GPU exists — and the shipped seeds hardcode
      `device = "gpu-vulkan"`, so a CPU-only install shows VRAM in use with 0.0 RAM. Separately,
      the cgroup probe shells `podman inspect` as `User=hal0` against ROOT slot containers, so
      it silently returns 0 and every figure collapses to the coarse file-size estimate
      (2131.7 MB reported vs 2987.9 MB real RSS).
    repro: |
      hal0 slot capacity
      ls /dev/dri || echo "no render node"
      curl -s $API/api/hardware | jq '.gpus[0] | {compute_capable, vulkan_capable}'
      curl -s $API/api/slots/metrics | jq '.[] | {name, mem_rss_mb}'
    expect: >-
      On a box where /api/hardware reports NO gpu that is either `vulkan_capable` or
      `compute_capable` (or `gpus: []`), no slot reports non-zero VRAM MB, and a slot whose
      resolved device/backend is `cpu` reports zero VRAM. A box with vulkan_capable=true and
      compute_capable=false (render node passed through, no host ROCm) MUST book resident slot
      memory to VRAM — that is the fix, not the bug: `compute_capable` only means rocm-smi
      answered, and a vulkan runner genuinely serves on the iGPU. `hal0 slot capacity` Total MB
      must agree with `/api/slots/metrics` mem_rss_mb for the same RESIDENT slot in the same
      second (a warming slot showing the file-size+KV fallback while metrics reads 0.0 is
      documented, not a finding).
    last_result: { release: v1.0.0-rc.6, result: fixed }
    rc6_note: >-
      Both halves resolved: cgroup probe routes around the rootful-store denial via
      `systemctl show ... MemoryCurrent` (Total 2183.3 == mem_rss_mb 2183.3, above the model
      file size), and the VRAM gate is `vulkan_capable OR compute_capable` — the previous expect
      clause was stale for vulkan-only boxes and is rewritten above. The Overview/Settings tiles
      saying "No GPU compute access" on a vulkan-serving box is a SEPARATE UI defect tracked
      under `ui-polish-rollup-rc5` / `known-issues: slots-gpu-telemetry-on-vulkan-box-is-correct`
      — do not file it here. Upgrade nuance worth one line in the post-upgrade lane: an old
