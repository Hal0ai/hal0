      under root's umask, so on every fresh install it is root:root 0755 with a root-only 0600
      snapshot inside. hal0-api (User=hal0) then fails every pull-job snapshot write
      (model.pull_job_persist_failed, WARNING only) and cannot read the existing one, so the
      #626 restart-survival fallback is dead in both directions — GET
      /api/models/<id>/pull/status 404s after a restart. install/perms.py has no row for the
      directory, so `doctor perms --fix` cannot heal it, and install.sh's O13 chown list omits
      it. Pulls themselves work. The fail-soft WARNING and the installer-scoped "writable paths"
      doctor line are by-design (see known-issues `pull-job-persist-fail-soft-scope`).
    repro: |
      ls -ld /var/lib/hal0/model-pull-jobs && sudo -u hal0 test -w /var/lib/hal0/model-pull-jobs \
        || echo "hal0 CANNOT write"
      journalctl -u hal0-api -b 0 | grep -c model.pull_job_persist_failed
      systemctl restart hal0-api && curl -s $API/api/models/<seeded id>/pull/status   # 404 = defect
    expect: >-
      /var/lib/hal0/model-pull-jobs is hal0-writable after a fresh install, perms.py carries a
      row for it (and for activity.db + -wal/-shm), and a pull's status survives an hal0-api
      restart. Promote: a pytest over the perms table covering every path hal0-api writes.

  - id: doctor-perms-never-converges
    issue: 1896   # filed by rc.6 fix wave
    from: v1.0.0-rc.6
    severity: minor
    tier: mechanical
    lane: cli
    summary: >-
      `hal0 doctor perms` exits 1 with DRIFT rows on a freshly installed box, and its own
      remediation (`sudo hal0 doctor perms --fix`) cannot produce a durably green audit — three
