      unguarded up through wait_ready/_await_ready/SlotManager.load: the load aborts at ~7 s
      instead of the 180 s window, the ERROR stamp gets an EMPTY metadata.message (the explicit
      still_report_if of crash-loop-warming-180s-window), and the route answers the generic
      system.internal 500 (symptom already covered by #1424 — record that half as known). Every
      other httpx catch in src/hal0 uses HTTPError/RequestError; the sibling call in
      slots/watchdog.py is guarded. Same unguarded probe sits on the dispatch hot path
      (SlotWatchdog.readiness_check via Dispatcher._check_container_slot_ready) — code-read
      only, would 500 an inference request instead of the retryable slot.loading 503. No test in
      the suite simulates anything but ConnectError.
    repro: |
      # Deterministic: bind a socket, accept one connection, SO_LINGER{1,0} abortive close, then
      # await container_provider().health(port) -> raises httpx.ReadError str=''.
      # In the wild: intermittent during a crash-looping load (1 in 5 failed loads on rc.6);
      # decisive journal shape: `hal0.unhandled  error=` (empty) + ReadError + POST .../load 500.
    expect: >-
