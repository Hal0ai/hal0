  - id: model-pull-jobs-root-owned
    issue: 1895   # filed by rc.6 fix wave
    from: v1.0.0-rc.6
    severity: minor
    tier: mechanical
    lane: cli
    promote_ready: true
    serialize: true   # repro restarts hal0-api — must not run concurrently with other lanes/probes
    summary: >-
