  - id: update-audit-trail-gaps
    issue: 1901   # filed by rc.6 fix wave
    from: v1.0.0-rc.6
    severity: minor
    tier: mechanical
    lane: upgrade
    summary: >-
      Three observability gaps in the updater's job/log correlation (verification itself is
      sound — the verified manifest with digest_sha256 + signer identity is durably written to
      /var/lib/hal0/cache/<version>/manifest.json only after sha256+cosign pass): (1) all three
      job runners construct Updater(channel=channel) without the job_id the parameter exists to
      thread, so every parent-side updater.* journal line logs job_id=None; (2) the routed
      `hal0-update stage` child pins its structured log to stderr, which is captured and
      surfaced only on failure, so NO prepare/verify breadcrumb (sha256_ok, cosign_verify_ok,
      prepare_ok...) ever reaches the journal on success; (3) `cosign_skipped` is a dead job
      field — stage_release() never emits the key, so it is structurally always null. Do NOT
      re-report: version:null on a prepare job (that is the operator's pin, paired with
      resolved_version) or the absence of digest fields on the job record while the cached
      manifest exists.
    repro: |
      journalctl --since <upgrade window> -o cat | grep -oE 'updater\.[a-z_]+' | sort | uniq -c
      journalctl -u hal0-api -o cat | grep updater.swap_ok        # job_id=None = defect (1)
      grep -rn cosign_skipped src/ | grep -v test                 # one consumer, no producer (3)
      python3 -c "import json; d=json.load(open('/var/lib/hal0/cache/<ver>/manifest.json')); \
        print(d['digest_sha256'], d['signer_identity'])"          # attestation exists (context)
    expect: >-
      updater.* lines carry the real job_id; a successful prepare leaves at least
      sha256_ok/cosign_verify_ok breadcrumbs somewhere durable; cosign_skipped either gains a
      producer or is removed. Escalate to a REAL finding if the cached manifest is missing, is
      written before verification passes, or records a digest that mismatches the extracted
      tarball.

