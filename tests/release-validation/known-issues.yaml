  - id: load-restart-error-surfacing
    status: open
    issue: 1424
    summary: >-
      Slot load/restart failures surface as CLI timeouts or generic errors rather than the
      underlying runner error.
    note: >-
      rc.5 found the INVERSE defect producing a byte-identical string — a SUCCESSFUL slot verb
      also prints `ReadTimeout` and exits 1, because `api_post` caps the client read at 10 s
      against a 180 s server budget (#1832). Do not assume a ReadTimeout means the operation
      failed; always verify the server-side outcome before reporting either issue.
    rc7_note: >-
      Confirmed this covers the GPU preflight refusal shape specifically: `GpuPreflightError`
      (`providers/_gpu.py`) is a plain `RuntimeError`, not a `Hal0Error` subclass, so it never
      reaches the typed-envelope path and `POST /api/slots/<n>/load` returns the generic
      `{"error":{"code":"system.internal","message":"internal server error"}}` for EVERY GPU
      preflight refusal (Vulkan stale-image gate, render-node gate, /dev/kfd gate alike) —
      verified on ct151 with a forced stale-image Vulkan slot load. This is #1424, not a new
      finding, PROVIDED the full actionable message is present one GET away on the slot record
      (`GET /api/slots/<n>` -> `metadata.message`) and rendered by `hal0 slot show`/`slot list`
      — verified true in the same probe. Do not re-file "bare 500 on slot load failure" without
      also checking metadata.message; if that is ALSO empty, it is regression
      `container-health-readerror-unhandled`'s territory, not this entry's.
    review_at: v1.0.0
    review_due: true

