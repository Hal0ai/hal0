      /api/updates/state or /check) reads a historical job and reports the box not converged
      after the boot retry or a re-run converted it; OR a job reports ok/converged true while its
      own post-swap migration logged updater.post_swap_migration_failed; OR the boot retry still
      fails to convert after `doctor perms --fix` + restart.
    review_at: v1.5.0

