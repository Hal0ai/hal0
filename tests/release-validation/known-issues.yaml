      on first slot start. "converged" means pins resolved and catalogue synced.
    still_report_if: >-
      The component reports converged while its converge result carries a catalogue_sync_error not
      surfaced in `hal0 update`, `hal0 update status` or the dashboard row; OR its per-runner
      detail rows disagree with resolve_runner_image in the running daemon (stale refs from the
      previous release; ct150 showed old hal0-toolbox-* refs in the stored rows); OR a slot whose
      image is Store=missing fails to start instead of pulling on first load, or the first-load
      pull shows no progress state; OR an install/update path or docs promise that `hal0 update`
      pre-pulls runner images. Do NOT re-report Store=missing after an update or the
      "N images | N images | converged" row.
    review_at: v1.5.0

  - id: ui-rail-openwebui-link-unnamed
    status: by-design      # operator wontfix; real but accepted, not a product ruling
