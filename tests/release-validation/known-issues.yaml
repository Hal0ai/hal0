  - id: v1-malformed-body-404-agent
    status: by-design
    adjudicated: v1.4.0-nightly.20261014214325
    related_issue: 1840
    summary: >-
      On a box whose `agent` slot has no `[model]`, POST /v1/chat/completions with an unparseable
      body, an empty body, a non-object JSON body, or `messages` but no `model` returns 404
      dispatch.no_route "model 'agent' not found in registry ..." instead of a 400 invalid-JSON.
    why: >-
      _read_json_body (v1.py:264-298) deliberately coerces empty/malformed/non-dict bodies to {}
      ("validation of the parsed shape belongs to the upstream"; unchanged since 517d47c3), and the
      {} body takes ADR-0023 rule 9 to the agent anchor, which is already adjudicated for
      model-less boxes in model-default-marker-is-per-type-fallback. It still fails loudly with a
      4xx. The 400 "'messages' is required" seen for model-without-messages is llama-server's, not
      hal0's. The operator closed the same class (#1840 items 7 and 8) NOT_PLANNED as "real but
      cosmetic"; CLAUDE.md forbids filing cosmetic-only findings.
    still_report_if: >-
      A malformed, empty or non-object body on /v1/chat/completions (/v1/completions,
      /v1/embeddings) returns 2xx, yields a real completion, or triggers a slot cold-load or model
      pull; OR a valid body that DOES carry a `model` is reported as no_route for model 'agent';
      OR on a box whose agent slot HAS a model bound a malformed body returns 404 no_route instead
      of an upstream 4xx; OR the operator reopens #1840 items 7/8.
    review_at: v1.5.0

  - id: memory-add-ignores-unknown-body-keys
    status: by-design
    adjudicated: v1.4.0-nightly.20261014214325
    summary: >-
      POST /api/memory/add with `bank_id` (or a typo like `datset`) instead of `dataset` returns
      200 and the write lands in `shared`, whereas an invalid `dataset` value returns 400
      memory.namespace_invalid.
    why: >-
      The handler is hand-parsed and reads only `dataset` (docstring memory.py:767, docs
      memory.mdx, mcp-tools.mdx:289); unknown keys are tolerated across hand-parsed routes
      (brain-chat-hand-parsed-body). No /api/memory body route takes `bank_id`; it exists only as
      a path segment on the engine-admin router. Under ADR 0005 the only body-selectable write
      namespace is `shared` (private is header-only; a `private:` body value is a 400), so an
      ignored key can never send a write somewhere a correctly keyed call could not.
    still_report_if: >-
      Any doc, UI request, CLI verb, hermes plugin, MCP schema or error message tells callers to
      send `bank_id` (or any key other than `dataset`) in the body of /api/memory/{add,search,
      recall,list,delete}; OR the body-selectable write namespace set grows beyond `shared`, so an
      ignored key would silently misroute; OR a write whose namespace key was ignored lands
      outside `shared` or in another agent's private scope; OR the MCP memory_add tool DECLARES a
      bank/namespace property and silently ignores it (mcp-args-additional-properties-open).
    review_at: v1.5.0

  - id: podman-healthcheck-transient-failed-units
    status: by-design
    adjudicated: v1.4.0-nightly.20261014214325
    summary: >-
      `systemctl --failed` lists a transient `<cid>[-<hash>].service` ("[systemd-run] podman
      healthcheck run") for ~30 s after every slot load/restart (longer for slow loads, one
      HealthInterval per failing probe).
    why: >-
      Podman runs the first healthcheck ~100 ms after container start, before llama-server
      listens, and `podman healthcheck run` exits 1 even inside --health-start-period (the period
      only stops it counting toward retries). hal0's only part is the HealthCmd/HealthStartPeriod
      override (#684, providers/base.py:86-90). Identical on podman 4.9.3 and 5.7.0, privileged
      and not. The unit clears on the first passing check. No hal0 surface (doctor, doctor
      bundle, slot list, bench) reads system-wide failed units. Different from
      slot-delete-leaves-failed-unit (a persistent `hal0-slot@` residue). Lane failed-unit diffs
      should carve these out.
    still_report_if: >-
      The transient unit is still in `systemctl --failed` after the container is healthy plus one
      HealthInterval (30 s); OR it survives removal of the container / slot unload (leak); OR any
      hal0 surface counts it as a failure or degrades status because of it; OR the slot's own
      `hal0-slot@<name>.service` enters failed during a normal load.
    review_at: v1.5.0

  - id: runner-images-converged-is-catalogue-only
    status: by-design
