  # ── Adjudicated in v1.4.0-nightly.20261015200136 ───────────────────────────

  - id: memory-extraction-serializes-with-chat-on-fresh-install
    status: by-design
    adjudicated: v1.4.0-nightly.20261015200136
    related_issues: [2734, 2669, 2716]
    summary: >-
      On a stock fresh install (utility and agent model-less, brain `--parallel 1`), one
      /api/memory/add keeps brain busy for ~200 s (retain_extract_facts 3965 tokens against the 4096
      cap, ~112 s; then consolidation, uncapped, 5360 tokens, ~89 s). A 4-token hal0/utility chat
      queued behind each took 108 s and 87 s versus 0.2-0.4 s idle. Requests queue and complete 200;
      nothing 5xx. Chat is blocked only while an extraction or consolidation call is in flight, not as
      a standing condition.
    why: >-
      Accepted v1.4.0 consequence of the `--parallel 1` stopgap (#2714/#2731), tracked by #2734
      (open, v1.5.0, which names "extraction plus chat all wait on each other"; its 10-15 s per
      steward turn estimate understates the wait behind memory work ~10x - timings posted there).
      Length comes from #2669 (consolidation has no output cap) and lfm2.5-2.6b extraction running
      near the 4096 cap (~660 output tokens per fact). hindsight-api documents the model-less
      fallback to the agent anchor; ADR-0023 rule 9 is the anchor fallback. On a CPU-only box the
      wait is longer and covered by hermes-memory-turn-slow-on-cpu. Workarounds: bind a model to
      utility, or `hal0 memory graph enable --slot <name>`. Boxes with a model on utility (ct105)
      do not hit it. Not reproduced: a standing "all chat stalls 1-3 min"; a 179 s Hermes recall
      turn (not re-run). "3633 output tokens for a 40-token input" misreads the log: input_tokens is
      ~3.2-3.4k (extraction prompt plus content).
    still_report_if: >-
      A chat or /v1 request queued behind Hindsight work fails (5xx, dispatcher timeout,
      client-visible error) instead of completing; OR one queued request waits > 300 s; OR a
      retain_extract_facts call shows n_predict above the effective RETAIN_MAX_COMPLETION_TOKENS;
      OR chat on brain or agent waits behind extraction on a box where utility IS bound to its own
      model (that is #2716 or new); OR after #2734 lands (brain --parallel > 1 or per-sequence
      windows) chat still queues behind extraction or consolidation; OR the retain/consolidation
      queue fails to drain across two 10-minute samples with no new writes.
    review_at: v1.5.0

