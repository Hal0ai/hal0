  - id: memory-reranker-code-path-fallback-only
    status: open
    issue: 2721
    summary: >-
      With Hindsight >= 0.8 (shipped 1.0.0) recall never calls hal0's external reranker or the
      rerank slot; the [memory.embedding] rerank_* knobs and the Settings > Memory Reranker
      panel change nothing about recall.
    why: >-
      The code is deliberate (#1612, 55edfa6d): HindsightProvider.recall calls _rerank_union
      only when no recalled item has a numeric score (hindsight_provider.py:1732-1733) and
      Hindsight returns scores.final (which includes its own bundled cross-encoder, run on CPU)
      on every result, in unified and multi-bank mode. The defect is the documentation and UI
      copy, filed as #2721 (docs/ui). Recall quality is not lost.
    still_report_if: >-
      A recall against Hindsight >= 0.8 that returns at least one result without a numeric
      scores.final does not trigger POST /v1/rerankings; OR any doc, schema description, CLI
      help or dashboard string again claims that [memory.embedding] rerank_* or the rerank slot
      re-ranks memory recall unconditionally; OR hal0 repoints Hindsight's reranker at the
      rerank slot and recall still does not hit the slot; OR the seed-stack docs again claim the
      rerank row is needed for memory recall.
    review_at: v1.5.0

