    review_at: v1.1.0

  # ── Adjudicated by-design in v1.0.0-rc.6 ────────────────────────────────────

  - id: model-add-detection-surfacing
    status: by-design
    adjudicated: v1.0.0-rc.6
    related_issue: 1838
    summary: >-
      `hal0 model add` still registers a no-GGUF-magic file as `chat`, keeps
      `detection_confidence: high` on a bare no-signal chat default, and does not use
      `general.architecture` as a capability tie-breaker.
    why: >-
      All three are the documented residue of #1855, which closed #1838: the no-magic chat
      fallback is deliberately SURFACED, not fixed (warning line + detection_confidence=low +
      detection_warning); the bare-chat default "stays high, since that's the correct, expected
      answer for the overwhelming majority of causal-LLM ggufs"; and `general.architecture` was
      explicitly deferred with a reason this fleet's own headers confirm ('bert' is shared by
      the reranker and the embedder family, so it cannot break the tie). Filename-derived
      capabilities print `confidence: medium`. Junk registrations are recoverable with
      `hal0 model rm` and never auto-bind. On the update box use /usr/lib/hal0/venv/bin/hal0 —
      the stale rc.3 wrapper (#1844) reproduces PRE-fix behaviour.
    still_report_if: >-
      The filename-derived `confidence: medium` line or `metadata.detection_confidence` stops
      appearing; OR a no-magic file registers with NO warning; OR a reranker/embedder added
      under its UPSTREAM filename classifies as `chat` (that is #1796 regressing — serious); OR
      a header that DOES carry pooling_type, an unambiguous general.tags rerank/embed token, or
      attention.causal=False is overridden by the filename; OR a junk registration auto-binds to
      a slot, survives `model rm`, or crash-loops a slot without an explicit `model run`. Do NOT
      re-report: byte-identical ggufs getting different caps purely from filenames when the
      header has no signal; high confidence on the no-signal chat default; architecture not
      being a tie-breaker; the `Next:` hint printing after the warning line.
    review_at: v1.1.0

  - id: brain-chat-context-exceeded-500-transient
    status: by-design
    adjudicated: v1.0.0-rc.6
    summary: >-
      A single historical `POST /api/brain/chat` turn saw llama-server answer HTTP 500 "Context
      size has been exceeded." on a short prompt.
    why: >-
      A llama.cpp runner-side defensive branch (`n_past + 1 >= n_ctx` on a --no-context-shift
      slot), observed once during heavy concurrent slot churn, on a container reaped 60 s later;
      2/2 fresh repro attempts returned 200. Not a hal0 request-shaping defect: hal0 hard-caps
      the steward's completion at 4096 (`_MAX_COMPLETION_TOKENS`), an over-long prompt returns
      HTTP 400 `exceed_context_size_error`, and prompt+n_predict over the window returns 200
      with finish_reason=length — the 500 is not reachable by request size. The string lives in
      the llama-server binary, not in hal0.
    still_report_if: >-
      The SSE error frame `primary slot HTTP 500: ...Context size has been exceeded.` reproduces
      >=2 times on a short prompt against a slot whose /slots n_ctx is >=16384, AND
      hal0.brain_chat is demonstrably sending prompt+max_tokens above that window (requires a
      code change to the 4096 cap to even be possible). A single occurrence during concurrent
      slot churn is a runner transient.
    review_at: v1.1.0

  - id: chat-to-embed-slot-500-passthrough
    status: by-design
    adjudicated: v1.0.0-rc.6
    related_issue: 1894   # typed capability-mismatch envelope, filed by rc.6 fix wave
    summary: >-
      With the `embed` slot loaded, POST /v1/chat/completions naming any model whose id contains
      "embed" or "rerank" is forwarded to the embeddings llama-server and returns that server's
      verbatim HTTP 500 "the current context does not logits computation. skipping".
    why: >-
      Two intentional, test-locked designs compose. (1) Rule 7 of capability routing pins the
      name substrings "embed"/"rerank" to the embed slot (_capability_resolve.py
      _EMBED_NAME_HINTS; locked by tests/dispatcher/test_router.py) — the registry TYPE of the
      named model is irrelevant (an unregistered "totally-made-up-embedder" and the slot's own
      advertised model produce the identical 500 via legacy and passthrough paths respectively).
      (2) Dispatcher.forward() passes upstream non-2xx bodies through verbatim by documented
      contract. hal0 has no capability/type gate at dispatch (model_fit.slot_type_mismatch is a
      bind-time check). Capability IS disclosed in /v1/models labels/recipe. With embed OFFLINE
      (fresh-install default) the same request returns a clean typed 404. A typed 409/400
      capability-mismatch envelope is an enhancement request, filed as a minor — the ugly-error
      precondition is the NORMAL prod state (embed kept loaded), which is why it is worth fixing
      but not worth relitigating as a routing bug. Do NOT frame this under
      dispatcher-unknown-model-passthrough (that is anchor substitution; here the embed slot
      really served the request).
    still_report_if: >-
      A request naming a CHAT-capable model (labels contains "chat") is routed to a non-chat
      slot; OR the 500 occurs with the embed slot OFFLINE (must be a clean 404 then); OR
      /v1/models stops disclosing per-model labels/recipe; OR hal0 ships a typed
      capability-mismatch error and this path still leaks the raw upstream 500.
    review_at: v1.1.0

  - id: capability-apply-persists-intent-on-lifecycle-failure
    status: by-design
    adjudicated: v1.0.0-rc.6
    summary: >-
      A capability apply that fails at the slot-lifecycle stage still leaves `enabled = true`
      (and the chosen model/device) committed in /etc/hal0/capabilities.toml and the slot TOML.
    why: >-
      Deliberate and load-bearing since #697: CapabilityOrchestrator.apply commits
      capabilities.toml and the slot TOML as one atomic ChangeSet BEFORE lifecycle dispatch,
      precisely so a failed bounce cannot leave the two files disagreeing (the pre-#697
      half-applied drift). capabilities.toml is a desired-state file; the failure is reported
      truthfully out-of-band — the apply returns a typed HTTP 500 slot.spawn_failed naming the
      unit and the journalctl command, and `hal0 status`, `hal0 slot list`,
      GET /api/capabilities (status:"error") and GET /api/slots/<n> all report it. Recovery is
      one call: `hal0 capabilities set <slot> <child> --disabled`. The retry is bounded by the
      systemd start limit and the load-failure breaker (an automatic retry load can make the
      selection read `warming` ~6 min total — two loads, each respecting the 180 s dwell). The
      one SILENT surface — `hal0 capabilities list` dropping the `status` field it already has —
      is a real cosmetic gap, collected in regression `rc6-polish-rollup` item 1.
    still_report_if: >-
      The failing apply returns 2xx, or an untyped 500 with no unit/journal pointer; OR
      GET /api/capabilities reports the selection's status as anything other than error/offline
      once the slot has settled (>240 s after the last load call); OR `hal0 status`/`slot list`
      show ready/serving/offline while the unit is failed; OR the automatic retry is unbounded
      (re-enters warming more than twice per apply, or restarts accumulate past the start
      limit); OR `capabilities set --disabled` no longer recovers the box.
    review_at: v1.1.0

  - id: doctor-perms-secrets-dir-0700-is-declared
    status: fixed          # #1896, v1.0.0-rc.7 — the 0755 declaration is gone
    adjudicated: v1.0.0-rc.6
    summary: >-
      `hal0 doctor perms --fix` widens /var/lib/hal0/secrets and secrets/agents from 0700 to
      0755.
    why: >-
      RESOLVED, not by-design any more. The rc.6 adjudication was correct that the widening was
      not a credential leak (*.env stays 0600 root:root either way), but the underlying defect it
      named — perms.py (0755) and hal0-agentenv (`install -d -m 0700`) DISAGREEING, so the mode
      oscillates forever — was fixed in #1896 by moving the TABLE to the restrictive side: both
      secrets rows now declare 0700, install.sh births them 0700, and the agentenv seam is
      unchanged. The one non-root traverser, `installer/wrappers/hermes` (it re-execs as the
      unprivileged `hal0` user per the #843 run-as-hal0 guard, then sources
      secrets/agents/hermes.env), is already blocked one level down — every *.env inside is 0600
      root:root — so 0700 costs no reader any access and removes local agent-id enumeration.
      Still never assert a drift ROW COUNT — the set grows with every slot loaded / model pulled.
    still_report_if: >-
      /var/lib/hal0/secrets or secrets/agents is observed at any mode other than 0700 after
      `doctor perms --fix`; OR a file under secrets/ is observed at a mode other than 0600, or
      owned by anything but root:root; OR secrets/hal0-api.env is not covered by a PermRow and
      lands group/world-readable.
    review_at: v1.1.0

  - id: pull-job-persist-fail-soft-scope
    status: by-design      # scopes the model-pull-jobs finding; the ownership defect itself is real
    adjudicated: v1.0.0-rc.6
    summary: >-
      Three sub-claims around the root-owned model-pull-jobs finding that must not be re-filed:
      the WARNING-only persist failure, the doctor "writable paths: ok" line, and root-owned
      activity.db.
    why: >-
      (1) persist_pull_job's fail-soft is by-design and correct — its docstring: "A failure to
      persist must never break the pull flow"; the defect is the directory ownership making the
      failure permanent (regression `model-pull-jobs-root-owned`), not the log level. (2)
      `hal0 doctor`'s "OK writable paths: ok" is an INSTALLER preflight
      (installer/lib/preflight.sh:428) probing whether ROOT can create /opt, /usr/lib, /etc/hal0
      etc. — it never claimed to be a service-user state-writability check. (3) activity.db
      root-ownership on ct150 is a pre-rc.5 legacy artifact (Aug 1); a fresh rc.6 install
      creates it hal0:hal0 and /api/activity 200s — and the outage surface is honest (503
      activity.unavailable, not empty-200).
    still_report_if: >-
      The pull flow itself fails or the model/registry row is lost; OR the doctor line is
      reworded to claim service-user writability while a hal0-api state path is unwritable; OR
      `hal0 doctor perms` gains a service-user writability check that still passes over an
      unwritable model-pull-jobs; OR activity.db is root-owned on a box freshly installed with
      rc.6+; OR /api/activity returns 200-with-empty instead of 503 when the store is down.
    review_at: v1.1.0

  - id: hermes-cwd-eacces-crash
    status: by-design
    adjudicated: v1.0.0-rc.6
    summary: >-
      Invoking the RAW hermes venv binary (`/var/lib/hal0/venvs/hermes/bin/hermes -z ... --cli`)
      from a cwd the effective user cannot traverse aborts with
      `[Errno 13] Permission denied: '/root/.git'`.
    why: >-
      Upstream hermes-agent defect (`_find_git_root` uses Path.exists(), which re-raises
      EACCES), unfixed in both shipped versions (0.18.2 and 0.19.0) — but hal0's canonical
      entry point /usr/local/bin/hermes (locked decision #3) carries an explicit cwd-safety
      guard for exactly this (fix #536, present since v0.4.1-alpha.1) plus the run-as-hal0
      guard; the guard is present and fires on all three fleet boxes. Reaching around the
      wrapper to the venv binary is an unsupported invocation that also skips the root-clobber
      guard and the outbound-credentials env. No hal0-shipped caller drives an agent turn
      through the raw binary from an untraversable cwd.
    still_report_if: >-
      The canonical /usr/local/bin/hermes wrapper (or its hal0-hermes symlink) ITSELF fails with
      Errno 13 from an untraversable cwd; OR the cwd-safety guard block is absent from the
      wrapper on a fresh install; OR hal0-hermes is installed as a real file rather than a
      symlink to the guarded wrapper; OR a hal0-shipped caller (a `hal0 agent` subcommand, an
      installer step, or hal0-agent@<id> gaining an untraversable WorkingDirectory=) drives a
      turn through the raw binary; OR upstream moves the git-root walk somewhere the wrapper's
      cd cannot protect.
    review_at: v1.1.0

  - id: update-restart-error-breadcrumb-on-success
    status: by-design
    adjudicated: v1.0.0-rc.6
    summary: >-
      A successful upgrade's job record carries `restarted: null` together with
      `restart_error: "systemctl exited -15"`.
    why: >-
      This IS the #1691 fix (be49ff6d, shipped since rc.3, pinned by
      test_apply_restart_sigterm_is_ambiguous_not_failed): hal0-api restarts itself from inside
      its own cgroup, systemd SIGTERMs the still-exiting systemctl child, so a negative
      returncode is genuinely ambiguous. `restarted` is the tri-state verdict field (True /
      False=real failure / None=bounce in flight); `restart_error` is a retained diagnostic
      breadcrumb, logged at INFO as updater.restart_signalled. No operator surface renders it as
      a failure: the CLI warns only on restarted=False, the dashboard toasts success on
      state=applied. Every standard (service-user) install produces this on every successful
      upgrade.
    still_report_if: >-
      The CLI prints "hal0-api restart did not complete" on an upgrade whose swap succeeded and
      whose hal0-api came back (restarted recorded false, not null); OR the dashboard shows a
      failed update for a job in state applied; OR restart_error is populated while restarted is
      true; OR restarted stays null with restart_error set on a box where hal0-api did NOT come
      back (no post-restart "Application startup complete." under a new pid within ~60 s) —
      that last case is a REAL failed restart reported as ambiguous.
    review_at: v1.1.0

  - id: brain-tool-model-points-at-modelless-slot
    status: by-design
    adjudicated: v1.0.0-rc.6
    summary: >-
      A fresh non-interactive install ships `[brain_chat] tool_model = "hal0/agent"` while the
      `agent` slot is deliberately model-less.
    why: >-
      The pairing is the intended v1.0 shape, decided three times over: the agent anchor ladder
      is 15-31 GB and the pull is opt-in/default-SKIP (spec-p3-brain §5b/5c, #1369); on the
      shipped ade07ba runner the brain models are NATIVE tool-callers, so tool_model is only the
      artefact-round fallback; and `hal0/agent` is a VIRTUAL anchor resolved through the
      fallback chain — verified live: POST /v1/chat/completions {"model":"hal0/agent"} returns
      200 served by the brain model with the agent slot offline. If the reroute ever fails, the
      tested `_tool_reroute_unavailable_message` degrades honestly, and the installer's skip
      path prints the gap plus the exact remediation. Upgraded boxes carry a bound agent slot
      and never see it.
    still_report_if: >-
      POST /v1/chat/completions with model hal0/agent on a fresh install returns a dispatch
      error instead of resolving to a live slot (the _configured_primary last-resort broke); OR
      a brain turn entering a tool chain reaches done with an EMPTY reply, raw dispatch
      envelope, or stack trace instead of the reroute-unavailable sentence; OR the steward
      answers a live-state question with invented slot/model names while hal0/agent has no model
      bound (#1789 regressing — GA blocker, file it there); OR the shipped agent.toml gains a
      [model].default making a multi-GB pull unconditional while install.sh still asks; OR the
      skip path stops printing the "no live target until an agent model is bound" notice; OR
      tool_model is repointed at a slot with no DEFAULT_CHAINS entry.
    review_at: v1.1.0

  - id: cli-slot-show-panel-clips-long-json-lines
    status: by-design
    adjudicated: v1.0.0-rc.6
    summary: >-
      `hal0 slot show` visually clips long JSON values (resolved_command entries,
      _synthetic_reason) at the current terminal width.
    why: >-
      Rich's Syntax panel is word_wrap=False by default — renderer clipping at terminal width,
      no slice in hal0's code, no data dropped (full line prints at COLUMNS>=110), and `--json`
      is documented on this exact command and emits the complete payload. Same adjudication as
      cli-agent-status-detail-truncated. Affects every long value, not synthetics specifically.
      The synthetic hal0 entry's residues that ARE real (logs 404 wording; the factually wrong
      _synthetic_reason string for the composite) live in regression `rc6-polish-rollup` item 2.
    still_report_if: >-
      `hal0 slot show --json` is missing, errors, or omits a field the panel shows; OR the panel
      drops a line entirely rather than clipping at width; OR a value is clipped even at a wide
      terminal; OR the CLI grows a non-JSON summary view whose only copy of an actionable
      remediation string is the clipped one.
    review_at: v1.1.0

  - id: ui-inference-card-header-is-device-highlight
    status: by-design
    adjudicated: v1.0.0-rc.6
    summary: >-
      The Slots-page Inference Engine header ("7 iGPU · 1 FLM") does not sum to the rendered
      row count.
    why: >-
      It is an accelerator-placement highlight, not a census: iGPU deliberately aggregates
      vulkan+rocm (the same integrated GPU on target hardware); the FLM chip points at the
      cordoned NPU · FLM pane, whose slot is not a row here (rationale in-code at
      inference-pane.jsx:657); cpu-backed slots have no chip. The authoritative count is the
      card footer's "slots N", which is correct.
    still_report_if: >-
      The footer "slots N" itself disagrees with the rendered row count; OR a vulkan- or
      rocm-backed slot is missing from the iGPU tally (or a cpu/flm slot counted in it); OR the
      FLM count is non-zero while the NPU · FLM pane renders no such slot; OR the header is
      relabelled to claim a total.
    review_at: v1.1.0

  - id: ui-bench-worker-badge-on-benchmarks-page
    status: by-design
    adjudicated: v1.0.0-rc.6
    summary: >-
      The Overview page has no bench-worker badge, and the badge that exists shows "stopped"
      beside a running unit.
    why: >-
      The badge lives on the Benchmarks page (#benchmarks, rail entry nav-benchmarks), "Run
      Queue" tab — it was never on Overview; the redesigned single-page framing in old repros is
      stale wording, not a removal. The visible "stopped" is the operator-ARMED state
      (control.state, safe-by-default off); unit liveness is carried separately by the subtitle
      ("hal0-bench-worker is running, idle until Start") and the dot tooltip ("worker: idle
      (worker alive)"), derived from the /api/benchmarks/queue `updated` heartbeat (<30 s). That
      separation IS the #1797(1) remediation (PR #1805), verified in the shipped rc.6 bundle.
    still_report_if: >-
      The Benchmarks view is unreachable from the rail or renders no benchmarks-view testid; OR
      the Run Queue tab has no worker badge/dot at all; OR the liveness line contradicts
      `systemctl is-active hal0-bench-worker` relative to a fresh/stale heartbeat; OR the badge
      reports the armed state as the ONLY signal again.
    review_at: v1.1.0

  - id: memory-extraction-quality-is-anchor-dependent
    status: by-design
    adjudicated: v1.0.0-rc.6
    summary: >-
      Hindsight fact-extraction quality tracks whatever model the `agent` anchor is serving; an
      undersized anchor can emit prompt content (few-shot examples, Narrator scaffolding) that
      is stored as fact, with the retain op reporting completed.
    why: >-
      HINDSIGHT_API_LLM_MODEL=hal0/utility with the model-less seeded utility slot resolves to
      the agent anchor by design (resolver.py, ADR-0023 Rule 9, documented at length in
      installer/systemd/hindsight-api.service, already adjudicated under
      dispatcher-unknown-model-passthrough). hindsight_api is a vendored engine that persists
      the extraction LLM's output without grounding validation — inherent to LLM extraction and
      an upstream enhancement. Observed once on ct150 (anchor pinned to a 1.14 GB SFT at ctx
      4096); 0/3 fresh probes reproduced; absent on production with an assigned utility model.
      Do not re-file "hallucinated memory" as an engine defect. The actionable hal0-side gap —
      no extraction-prompt ctx preflight, HTTP 200 + document id for a retain the engine then
      drops — is regression `memory-extraction-ctx-preflight-missing`.
    still_report_if: >-
      Fabricated or prompt-derived facts are stored on a box whose resolved extraction slot IS
      serving an operator-assigned model with a window large enough for the extraction prompt
      (no "Context size has been exceeded" in the hindsight journal); OR a retain the engine
      drops with retain_extract_facts HTTP 500 still returns 200 + a document id with no failed
      op surfaced; OR hal0 gains the extraction ctx preflight and it fails to fire.
    rc7_note: >-
      A retain that yields ZERO facts is the same axis as one that yields fabricated facts, not
      a different defect — do not file "memory retain never lands" against this box shape
      without discriminating extraction YIELD from a broken pipeline first. rc.7 (ct151) found a
      0-fact retain against the shipped 1.1 GB SFT anchor completing (`status=completed,
      retry_count=0, error_message=None`) with the raw document stored but unsearchable — 2 of 3
      such ops were genuine 0-yield (a natural memory-worthy sentence extracted 0 facts), the
      other 3 were duplicate-content retains correctly deduping to "0 facts" (matching
      content_hash of an already-extracted document). SAME box, SAME run, the SAME extraction
      slot correctly extracted facts from three separate hermes-generated documents seconds
      apart — so this is anchor YIELD variance, not a broken retain path; a genuinely broken
      retain path on rc.7 instead surfaces as a LOUD terminal `failed` op with a real error
      (see regression `hindsight-response-format-400-via-thinking-policy`, a fully separate
      proxy-layer defect discovered while investigating this). Discriminate before filing: (a)
      retain a natural, memory-worthy sentence of comparable length to real agent content and
      confirm it ALSO yields 0 facts, not just a synthetic marker string; (b) check the
      document's content_hash is not a duplicate of one already extracted (duplicate retains
      correctly log "0 facts" — not a defect). still_report_if extended: also report if a retain
      yields 0 facts on a box whose resolved extraction slot IS serving an operator-assigned
      model, for content a comparable model extracts facts from; OR the 0-yield persists after
      hal0 gains an "extracted 0 facts" op/status indicator and it fails to fire; OR the retain
      op reports `completed` while the raw document is ALSO absent (that is data loss, not
      yield, and is not covered by this entry).
    review_at: v1.1.0

  - id: slots-gpu-telemetry-on-vulkan-box-is-correct
    status: by-design      # retires the "host telemetry leak" framing of #1841 item 1
    adjudicated: v1.0.0-rc.6
    related_issue: 1841
    summary: >-
      The Slots-page telemetry header showing live GPU util/clock/temp/watts on a box whose
      /api/hardware says compute_capable=false is NOT a host-telemetry leak when the box has a
      passed-through render node serving on vulkan.
    why: >-
      compute_capable is `rocm-smi --showproductname` exiting 0 — a host-ROCm-stack probe, not
      "does this box have GPU access"; rocm-smi ships inside the runner container, so it is
      false on most installs. On a vulkan-serving box the Slots-page numbers describe the
      accelerator hal0 is actually using. The real defects are the inverse: Overview/Settings
      claiming "No GPU compute access on this box" while slots generate tokens on that GPU, and
      the still-missing gate in telemetry-header.jsx, whose fix predicate must be
      `computeCapable || vulkanCapable` — NOT a copy of the computeCapable gate, which would
      suppress correct data on every vulkan box. Tracked under ui-polish-rollup-rc5 item 1.
    still_report_if: >-
      The Slots-page telemetry header renders non-null GPU/NPU util/clock/temp/watts on a box
      where /api/hardware reports BOTH compute_capable:false AND vulkan_capable:false, or with
      no /dev/dri render node at all. Do NOT report it on a box with a render node serving on
      vulkan.
    review_at: v1.1.0

  - id: slot-capacity-vram-on-vulkan-is-declared
    status: by-design
    adjudicated: v1.0.0-rc.6
    related_issue: 1839
    summary: >-
      `hal0 slot capacity` books resident slot memory to VRAM on a box with
      vulkan_capable=true / compute_capable=false, with ram_mb 0.0.
    why: >-
      That is the #1839 fix behaving correctly: the gate is `vulkan_capable OR compute_capable`
      (capacity.py:379), memory a vulkan runner has resident IS accelerator memory, and on a UMA
      part mem_mb == vram_mb is the documented convention. A warming slot showing the
      file-size+KV fallback while metrics reads 0.0 is the documented path-3 estimate. The
      regression entry's expect clause was rewritten in rc.6 to match.
    still_report_if: >-
      Non-zero VRAM MB on a box where EVERY gpu entry is compute_capable:false AND
      vulkan_capable:false (or gpus: []); OR a cpu-device slot reports non-zero VRAM; OR
      `hal0 slot capacity` Total MB is LOWER than /api/slots/metrics mem_rss_mb for the same
      resident slot sampled in the same second (capacity takes max(cgroup, file-size+KV
      estimate) and must never under-report); OR Total MB exceeds mem_rss_mb while ALSO
      differing by more than 0.2 MB from that slot's own file-size+KV estimate
      (size_bytes/1MiB + 0.5 MiB per 1000 ctx tokens, ctx = defaults.context_size else
      metadata.context_length else the launcher dense cap) — i.e. the figure is neither of the
      two legitimate inputs.
    rc7_note: >-
      Replaced the old ">5% at same second" clause — it self-triggered on the documented
      max(cgroup, estimate) floor for GTT-resident weights (capacity.py, #672, predates this
      entry) whenever a resident slot's cgroup sits below its model's file-size+KV estimate,
      which rc.7 (ct151) confirmed on 2 of 3 same-second-sampled resident slots (88-108%
      divergence, both matching the estimate to 0.1 MB, while the third slot — cgroup above its
      estimate — agreed with mem_rss_mb to 0.02%, proving the probe itself is live). Total MB
      exceeding mem_rss_mb while equalling the estimate is the floor working as intended,
      regardless of slot state, and is NOT a finding. `No slot capacity data.` while slots are
      pulling/starting is likewise by-design — `per_slot` only lists warming/ready/serving/idle
      slots with a bound model.
    review_at: v1.1.0

  # ── Adjudicated by-design: v1.0.0-rc.7 curation ─────────────────────────────

  - id: hermes-renders-upstream-400-as-context-exceeded
    status: by-design      # upstream hermes-agent behaviour, not a hal0 defect
    adjudicated: v1.0.0-rc.7
    summary: >-
      An upstream HTTP 400 that hermes cannot parse is reported to the user as "Context length
      exceeded (N tokens). Cannot compress further.", where N is a tiny number that has nothing
      to do with any context window.
    why: >-
      `agent/conversation_loop.py`'s failover classifier deliberately buckets a generic 400 into
      `FailoverReason.context_overflow` ("generic 400 + large session heuristic (#1630)"). Hermes
      then runs its compression ladder, cannot shrink an already-tiny turn, and emits the line
      at the compression-exhausted return path. The message is a fixed string on that path; it
      is not evidence that hermes measured a context window, and it is not evidence the anchor
      advertises a small ctx. This is pinned upstream hermes-agent code under hal0's
      VETTED_HERMES_REFS compatibility freeze; hal0 does not own the string. Verified on ct151:
      `GET /v1/models/hal0/agent` advertised context_length/max_context_window 65536 (>=
      MINIMUM_CONTEXT_LENGTH 64000) at the exact moment a hermes turn emitted this message, and
      the hal0-api journal showed ~10 consecutive genuine upstream 400s
      ("Failed to initialize samplers: std::exception", a grammar/response_format defect — see
      regression `hindsight-response-format-400-via-thinking-policy`) in the same window.
    still_report_if: >-
      The message appears while hal0's own /v1 surface is returning 200 for the same request
      shape (then the defect is in hermes' request construction, not the upstream); OR
      `GET /v1/models/hal0/agent` advertises context_length below MINIMUM_CONTEXT_LENGTH
      (64000) at the moment of the failure (that is the real #1827 regression and belongs
      there); OR hermes emits it with zero upstream non-2xx in the hal0-api journal for the same
      window. ALWAYS attach the hal0-api journal grep for "400 Bad Request" plus the serving
      slot's own `podman logs` for the window BEFORE filing anything under this symptom — the
      user-visible string names the wrong subsystem by construction.
    review_at: v1.1.0

  - id: update-rollback-defers-hal0-api-restart
    status: by-design
    adjudicated: v1.0.0-rc.7
    summary: >-
      `hal0 update --rollback` swaps the install tree, re-pips the venv, re-renders slot units,
      and exits 0 WITHOUT restarting hal0-api — the running process keeps serving the pre-
      rollback code until the operator restarts it.
    why: >-
      Explicitly documented (`docs/guides/update-and-rollback.mdx`: "Unlike an apply, a rollback
      does not try-restart hal0-api for you") and deliberately deferred in the #1549 commit
      (7c9ed3d2): "Not done here: restarting hal0-api automatically on rollback. That wants the
      background-job machinery commit already has ... rather than race it." Rollback is the only
      mutating updater operation that is not a background job, and auto-restarting it would race
      the restart ordering fixed in #1540. The dashboard rollback confirm dialog and the success
      toast BOTH state the requirement in the running-service copy
      ("...keeps serving until you restart hal0-api (Settings -> Advanced)"). One `systemctl
      restart hal0-api` self-heals cleanly (`/api/health` version agrees afterward). The CLI's
      OWN silence about this (it discards `rolled_back_to`/`schema_warning` and never compares
      against `/api/health`) is NOT covered by this adjudication — see regression
      `update-rollback-cli-silent-on-restart-need`, which is a real gap against closed #1541.
    still_report_if: >-
      `hal0 update --rollback` prints anything about a restart being required and it still does
      not happen; OR the dashboard rollback confirm dialog / success toast stops naming
      `systemctl restart hal0-api` (Settings -> Advanced); OR the docs guide's "does not
      try-restart hal0-api for you" paragraph is removed while the behaviour stays; OR rollback
      grows the background-job machinery (a job id, a state=applied record) and STILL skips the
      restart, since the #1549 deferral rationale ("wants the background-job machinery commit
      already has") is then spent; OR a rollback leaves the box in a state a manual `systemctl
      restart hal0-api` does NOT fix.
    review_at: v1.1.0

  - id: unversioned-openai-compat-paths-405-are-generic-not-rerank-specific
    status: by-design
    adjudicated: v1.0.0-rc.7
    related_issue: null
    summary: >-
      `POST /rerank` (unversioned) returns HTTP 405 `system.http_405` — the SAME generic 405
      returned for POST to ANY unrouted top-level path (`/chat/completions`, `/embeddings`,
      `/completions`, `/models`, `/totally-bogus-path`). Not a rerank-specific gap; there is no
      client-compatibility defect here.
    why: >-
      hal0's OpenAI-compatible surface is mounted exclusively under `/v1`
      (`app.include_router(v1.router, prefix="/v1")`), mirroring OpenAI's own convention and
      matching Cohere's and Jina's actual rerank paths, which are themselves versioned
      (`/v1/rerank`, `/v2/rerank`). `POST /v1/rerank` and `POST /v1/rerankings` both serve 200
      with correct relevance scores — verified end to end with a real reranker model on ct151.
      The unversioned `/rerank` 405 is a side effect of the SPA fallback route
      (`@app.get("/{full_path:path}")`), which deliberately matches every non-`/api/`, non-`/v1/`
      path for GET so the dashboard router works on deep links — POST to that same path is a
      plain Starlette 405, identical for every unrouted top-level path tested. No doc, UI
      string, or OpenAPI entry promises an unversioned `/rerank`; the OpenAPI document lists only
      `/v1/rerank` and `/v1/rerankings`.
    still_report_if: >-
      POST /v1/rerank or POST /v1/rerankings returns anything other than 200 for a well-formed
      body with the rerank slot loadable; OR the OpenAPI document, docs site, dashboard, or a CLI
      help/error string tells a user to POST an UNVERSIONED /rerank (or any other unversioned
      OpenAI-compat path); OR POST /rerank starts returning something OTHER than the generic
      system.http_405 every other unrouted path returns (i.e. it becomes genuinely
      rerank-specific); OR a mainstream rerank SDK is shown, with its emitted request line
      captured, to default to an unversioned /rerank against a custom base_url; OR hal0 begins
      serving some unversioned OpenAI-compat paths but not /rerank (inconsistent surface).
    review_at: v1.1.0

  - id: doctor-perms-split-brain-root-hermes-is-correct-detection
    status: by-design
    adjudicated: v1.0.0-rc.7
    related_issue: 843
    summary: >-
      `hal0 doctor perms` exits 1 on a box where /root/.hermes exists, reporting
      "split-brain /root/.hermes | DRIFT | root ran Hermes; remove after reconciling". This is
      the #843 root-clobber DETECTOR working correctly, not drift inflicted by a hal0-shipped
      path.
    why: >-
      The canonical entry point `/usr/local/bin/hermes` carries a run-as-hal0 guard, verified
      firing on ct151 (root + custom HOME -> directory left EMPTY, rc=0, no tree created). The
      installer and both systemd units (hal0-agent@hermes.service, hermes-gateway.service) pin
      HOME/HERMES_HOME off `/var/lib/hal0`, never `/root`. The detector's purpose is to go loud
      red the moment root DOES run Hermes (e.g. by reaching around the wrapper to the raw venv
      binary `/var/lib/hal0/venvs/hermes/bin/hermes`, or with `HAL0_ALLOW_ROOT=1`) because a
      root-owned ~/.hermes is a state tree the User=hal0 unit can never read — Hermes then
      silently falls back to the default provider, which is worse (silent wrongness) than a red
      doctor line. Reaching around the wrapper is the same unsupported-invocation class already
      adjudicated by-design under `hermes-cwd-eacces-crash`. The row is sticky by design: hal0
      deliberately will not `rm -rf` an operator-created path under /root on its own — the
      detail column says "remove after reconciling", not "auto-repaired". One genuine cosmetic
      gap: the red footer's remediation pointer, `sudo hal0 agent bootstrap hermes --repair`,
      reconciles ownership of the MANAGED tree but no shipped code path removes the STRAY tree,
      so a user following the footer literally sees no change — worth a one-line footer/detail
      tweak (append "then: sudo rm -rf /root/.hermes"), not a fix-wave issue.
    still_report_if: >-
      A hal0-SHIPPED path creates /root/.hermes on a fresh install — i.e. the split-brain row is
      DRIFT immediately after the installer finishes, with /root/.hermes's birth timestamp
      inside the installer's own run window and before any manual hermes invocation; OR the
      run-as-hal0 guard fails to fire (a root invocation of the canonical wrapper creates a
      stray tree, the guard script is missing, or none of runuser/setpriv/sudo are present so
      the wrapper proceeds as root instead of refusing); OR hal0-agent@<id>.service or
      hermes-gateway.service is observed with User=root or without HERMES_HOME/HOME pinned off
      /root; OR the audit reports the stray tree as ok/absent while /root/.hermes exists
      (detector false negative); OR the managed side drifts (HERMES_HOME tree, config.yaml,
      runtime.json, or the hermes venv owned by anything other than hal0); OR
      `sudo hal0 agent bootstrap hermes --repair` is made to claim it removed the stray tree and
      doctor perms still shows the row. Do NOT re-report: doctor perms exiting 1 solely because a
      validation agent, an operator, or HAL0_ALLOW_ROOT=1 ran the raw venv binary as root during
      the run — establish provenance by birth timestamp against the installer log's last mtime
      before filing.
    review_at: v1.1.0

  - id: tts-catalog-lists-qwen3-on-gpu-rocm-regardless-of-host
    status: by-design
    adjudicated: v1.0.0-rc.7
    summary: >-
      `catalogs.voice.tts` always lists `qwen3-tts` with `backends: [gpu-rocm]`, fit_status
      allowed, even on a box with no /dev/kfd where the top-level `.backends` array correctly
      omits gpu-rocm.
    why: >-
      `voice.tts` is a two-ENGINE switch, not a host-fit model list. `catalog.py`'s
      `_TTS_ENGINES` hardcodes `kokoro-v1 -> cpu` and `qwen3-tts -> gpu-rocm` because each engine
      has exactly one legal device; `_tts_rows_for_capability` injects both rows directly,
      bypassing the llamacpp host fan-out on purpose. Locked by
      `tests/capabilities/test_tts_capability_switch.py`, which does not mock hardware. The row
      stays honest about being unusable on a kfd-less box: `downloaded:false, pullable:false,
      size_gb:0.0`. An apply on such a box refuses loudly at the lifecycle stage
      (503 capability.apply_failed naming /dev/kfd) rather than serving silence. Do NOT confuse
      this with the SEPARATE, real defect where a locally-added chat/embed/rerank GGUF
      advertises `gpu-rocm` unconditionally regardless of host — see regression
      `capabilities-catalog-advertises-unavailable-gpu-rocm-for-registry-models`, which is a
      different code path (`_backend_variants`'s rocm branch missing a host-backends
      intersection) with no deliberate-engine-switch justification.
    still_report_if: >-
      The qwen3-tts row reports `downloaded: true` on a box with no staged Qwen3-TTS weights; OR
