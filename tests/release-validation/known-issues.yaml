  - id: brain-chat-malformed-body-is-empty-turn
    status: by-design
    adjudicated: v1.4.0-nightly.20261015021622
    related_issue: 1840
    summary: >-
      POST /api/brain/chat with an unparseable body answers 200, no error frame, and the model
      treats it as an empty user turn and makes read-only tool calls. In 6/6 runs no mutating or
      admin tool was called; '{}' and an empty-content message behave identically.
    why: >-
      run_brain_chat turns a ValueError from json.loads into payload={} which _frame_messages
      frames as the O18 empty user turn (see brain-chat-hand-parsed-body). A single create_task
      attempt is model improvisation on an empty turn, refused by the shipped [brain_chat]
      read_only=true. The shipped UI never sends such a body. Side question for an ADR check, not
      a finding: with read_only=false board mutations (create_task etc.) run with only an audit
      row and bypass the persona approval queue.
    still_report_if: >-
      An unparseable body reaches the model as anything OTHER than the framing of a well-formed
      '{}' (raw bytes or partial JSON in the user turn); OR a mutating/admin tool call from such a
      turn EXECUTES (board.chat.turn audit row, created task, slot/config change) on a box with
      read_only=true; OR the shipped default of [brain_chat] read_only stops being true; OR a
      shipped client is seen sending a body that hits the coercion path. A refused attempt is not
      a finding.
    review_at: v1.5.0

