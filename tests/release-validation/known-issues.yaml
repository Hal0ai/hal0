  - id: mcp-admin-path-args-are-stringified
    status: by-design
    adjudicated: v1.4.0-nightly.20261015021622
    summary: >-
      A non-string path arg to an admin MCP tool (slot_status name=123, ["x"], true, null)
      comes back isError=true with slot.not_found quoting the stringified value, not a type error.
    why: >-
      _split_args (mcp/admin.py ~1704) applies str() on purpose: admin tools are a generated
      proxy over REST routes and path params cannot carry a JSON type. The result matches the
      direct REST call byte for byte (GET /api/slots/123, /api/slots/['x']). Slot names are
      lowercase-only so a stringified bool/None/list/dict can never resolve a real slot. Only the
      error-code wording is left: cosmetic. slot_by_id slot_id=123 is a valid integer id.
    still_report_if: >-
      A non-string path arg returns isError=false; OR the stringified value resolves a resource
      the caller did not name and a mutating tool acts on it; OR it contains URL-structural
      characters (? # % ..) and routes to a different endpoint than the tool's template; OR the
      direct REST call with the same string returns a different status or code.
    review_at: v1.5.0

  - id: settings-redacts-token-count-keys
    status: by-design
    adjudicated: v1.4.0-nightly.20261015155017
    summary: >-
      GET /api/settings and /api/settings/fields echo memory.graph.extraction_max_tokens as
      {"value":"***REDACTED***","set":true} (secret=true); is_sensitive_key is True for
      extraction_max_tokens and max_tokens. It is the only masked leaf in /api/settings.
    why: >-
      Key-name redaction in hal0.api._redact (is_sensitive_key / redact_config) deliberately
      over-masks any key containing TOKEN, including count keys (#553 over-redact spec in
      _redact.py:46-51; pinned by tests/api/test_redact.py:43 and
      tests/fixtures/redaction_shapes.json sensitive_keys, which lists max_tokens, #2520;
      ui/src/sentry.ts:959 "over-masks max_tokens on purpose"). redaction.py:921-927 documents
      the count-name exemption (#2466/#2487) as applying only to the TEXT redactors. Nothing a
      user sees or saves is affected: the dashboard reads extraction_limits.max_tokens (4096,
      unmasked) from GET /api/memory/graph/status, and PUT /api/settings refuses every
      memory.graph.* key (settings.py:98-110, :173) so the masked object cannot be written back.
      Unmasking counts is a design change to the pinned contract (enhancement), not a release
      finding.
    still_report_if: >-
      A dashboard page or CLI command shows ***REDACTED***, [object Object] or a blank in place
      of a token-count setting; OR GET /api/memory/graph/status masks
      extraction_limits.max_tokens; OR a settings write or preview path (PUT /api/settings,
      /api/settings/preview, PUT /api/memory/graph) accepts the masked {value,set} object back
      and persists it or reports 'no change' for a real token-count change; OR is_sensitive_key
      stops masking a real credential key (HF_TOKEN, *_API_KEY); OR masking spreads beyond the
      key's own value (installer report or doctor bundle masks the literal number elsewhere, the
      #2439 class).
    review_at: v1.5.0

  - id: batch-retain-parent-retry-is-idempotent
    status: by-design
    adjudicated: v1.4.0-nightly.20261015155017
    issue: 2699
    summary: >-
      POST .../operations/<pending batch_retain parent>/retry returns 200 "queued for retry" and
      changes nothing about the in-flight children.
    why: >-
      retry_operation on a payload-less batch_retain parent means "re-run the batch's
      outstanding work": it re-queues only failed or cancelled children, deliberately leaves
      pending/processing children alone so a second worker cannot race a live one on the same
      document_id (engine comment cites #1795), and keeps the parent pending only while a non-
      completed child exists. Verified on ct151: child status, retry_count and updated_at
      unchanged, only the parent's updated_at moved. The memory brief's old expectation that
      this returns 409 was wrong (fixed in lanes/stateful/memory.md). The REAL defect is the
      cancelled-parent trap (#2699, regression memory-parent-op-stuck-cancelled).
    still_report_if: >-
      Retrying a pending parent changes any child's status, retry_count, worker_id or claimed_at
      while that child is pending/processing; OR leaves the parent in a different status than
      before; OR a second worker claims the same child; OR it returns 200 for a parent whose
      children are ALL completed (that must be the 409 "no incomplete sub-batches").
    review_at: v1.5.0

