    summary: >-
      After `hal0 update`, `hal0 update status` shows "Runner images | 8 images | 8 images |
      converged" while `hal0 runner-images ls` shows every pinned image Store=missing.
    why: >-
      The runner-images component only resolves each runner's pinned ref and syncs the images.json
