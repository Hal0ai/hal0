  # ── Open defects recognised in v1.0.0-rc.6 (tracked elsewhere — do not re-file) ─

  - id: slot-delete-leaves-failed-unit
    status: open
    issue: 1840        # item 5 of the rollup — already filed from rc.5, rediscovered in rc.6
    summary: >-
      Deleting a slot whose systemd unit is in terminal `failed` (a crash-looped slot) leaves
      `hal0-slot@<name>.service not-found failed` in `systemctl --failed`. All hal0-owned
      artefacts (TOML, state dir, quadlet, port claim) ARE removed; only systemd bookkeeping
      leaks. Clears on reboot, on `systemctl reset-failed`, or on re-creating and LOADING the
      same slot name (the load path calls reset_failed before every start). Deleting a healthy
      slot leaves nothing. The NPU delete route already does the reset (backends.py:434) —
      SlotManager.delete() never got the same treatment. On an id-keyed (upgraded) box the
      residue reads `hal0-slot@<id>.service`.

      This IS the literal unmet clause of `crash-loop-lifecycle`'s (#1791) own `expect` —
      "delete leaves no failed unit behind" (regressions.yaml lines 207/211, its repro's final
      step) — not a separate, unrelated defect. #1791 keeps scoring `partial` on this exact
      clause every release until it closes; do not let curation quietly detach it from #1791
      just because it is *also* filed and tracked for fix-agent purposes as #1840 item 5. Both
      references must be kept: #1791's register entry for "is #1791 fully fixed yet", #1840
      item 5 for "where is the fix ticket".
    still_report_if: >-
      Deleting a HEALTHY slot leaves a failed unit; OR the residue blocks re-creating/loading
      the same slot name (systemd refuses the start); OR a hal0-owned artefact (TOML, state dir,
      quadlet, port claim) also survives the delete; OR the delete returns non-200 while leaving
      the residue. Do NOT re-file a NEW issue for the bare `systemctl --failed` line — it is
      already tracked at #1840 item 5 and as the unmet clause of #1791 above — but DO keep
      recording it against both entries every release until it is fixed.
    review_at: v1.1.0

  - id: hermes-wheel-missing-web-dist
    status: by-design
    adjudicated: v1.0.0-rc.6
    related_issue: 1829
    summary: >-
      A fresh install's hermes-agent (0.18.2, from the pinned VCS commit) ships neither
      hermes_cli/web_dist nor the web frontend source, so GET :9119/ returns 404 "Frontend not
      built". The agent process is otherwise healthy and hal0's unit STATUS string says so
      truthfully ("hermes agent up; dashboard UI not built (no web_dist bundled)").
    why: >-
      hal0 deliberately pins hermes-agent to an immutable, reviewed upstream commit (9de9c25f /
      0.18.2) under a governed compatibility freeze (VETTED_HERMES_REFS + contract fixtures).
      The dashboard bundle is an upstream npm build artifact the pinned git tree does not carry
      pre-built, so a VCS install of the pin cannot contain it — and the tree ships no
      hermes_cli/web source either, so even a node-equipped box has nothing to build. hal0
      degrades honestly and the rc.6 release notes list it as a known limitation. The residual
      product gap (dead :9119/ static UI; the token scrape that depended on it) is OPEN #1829;
      record it as `known`. ct150's 200 comes from a hand-installed PyPI 0.19.0 wheel — legacy
      state no rc.6 code path produces, not evidence upgrades are fine.
    still_report_if: >-
      requirements.txt pins a hermes ref whose dist-info RECORD DOES list web_dist and :9119/
      still 404s; OR the STATUS string claims "hermes dashboard reachable" while :9119/ is
      non-200; OR the hermes unit crash-loops / :9119/api/status is non-200 (the missing dist
      breaking the PROCESS, not just the static UI); OR a hal0-owned surface regresses on
      account of it (brain board tools 401ing again post-#1829-rewire) — file that against the
      surface, not the wheel.
    review_at: v1.1.0

  - id: cli-api-polish-rollup-1840-still-open
    status: by-design      # process adjudication, not a product ruling
    adjudicated: v1.0.0-rc.6
    related_issue: 1840
    summary: >-
      All thirteen #1840 items reproduce on rc.6.
    why: >-
      #1840 is an open, unmilestoned polish backlog that rc.6 never claimed to fix — the rc.6
      CHANGELOG names it as the tracker for the remaining rc.5 sweep items, and rc.5 banded it
      "minors + cosmetics". A validation run reports it per-item against the regression register
