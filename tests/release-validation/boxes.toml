# The validation fleet. Update this file when a box is rebuilt, re-IP'd, or retired.
#
# `role` is what the lane registry in kit.toml keys off ("fresh", "update", "prod").
# Everything else is context handed to the preflight agent, which verifies it before the run
# starts. If a fact here is stale, preflight fails the run — that is the point.

hypervisor = "10.0.1.110"      # Proxmox; `pct` runs here. SSH direct to the guests, not via this.
ssh_key = "~/.ssh/thin-mint"
ssh_user = "root"

[boxes.ct151-cpu-fresh]
role = "fresh"
ctid = 151
hostname = "hal0-rc2-fresh-2604"
ip = "10.0.1.151"
os = "ubuntu 26.04"
privileged = false
gpu = true          # dev0 /dev/dri/renderD128 (Strix Halo iGPU) + dev3 /dev/accel/accel0 (XDNA NPU), both gid=991
cores = 8
ram_gb = 16
snapshot = "rc6-installed"
api = "http://10.0.1.151:8080"
auth_required = false
status = "PREFERRED fresh box as of 2026-08-15 — two snapshots, verified rc.6 install"
notes = """
Fresh-install lane. Reset: `pct rollback 151 pristine|rc6-installed` on the hypervisor.

This is the BEST fresh box in the fleet — the only one with snapshots. Two reset points:
  * `pristine`       — pre-install Ubuntu 26.04, for exercising the installer itself
  * `rc6-installed`  — hal0 1.0.0-rc.6 immediately post-install (2026-08-15): api + hermes
                       active, installer-seeded brain model present and serving. Do NOT assert
                       "no models on a fresh install" — the installer pulls the brain model.
(`rc5-installed` no longer exists.) Prefer this box over ct152, which has no snapshot and
carries residue.

GPU PASSTHROUGH since the rc.5 era (boxes' oldest gotchas predate it): the box exercises the
vulkan/container path (ghcr.io/hal0ai/hal0-rocmfpx runner in root's podman store). It has NO
/dev/kfd, so llama.cpp runs the VULKAN lane here — which is precisely what caught the rc.6
garbage-output defect. Run the coherence canary (_shared.md) before trusting any generated text.
Do not frame findings as "CPU-only box".

GOTCHAS, in order:
  1. The pristine snapshot has broken DNS — /etc/resolv.conf points at an unreachable
     Tailscale 100.100.100.100. Fix it before anything else or the install fails opaquely.
  2. (stale, retired) The install no longer needs HAL0_ALLOW_CPU_ONLY=1 — GPU passthrough
     exists.
  3. No NFS mount. Test models must be rsynced to /mnt/ai-models; workstation ggufs are often
     symlinks into huggingface/hub, so use `rsync -L` — and /mnt/ai-models is NOT in hal0's
     model roots, so a staged gguf is invisible until `hal0 model add`.
  4. (stale, retired) "/dev/dri absent in sysfs" predates the dev0/dev3 passthrough. After any
     `pct rollback 151`, confirm dev0/dev3 keep gid=991 or the installer's GPU preflight aborts.
  5. After a rollback to the `rc6-installed` snapshot, services do not come back on their own —
     `systemctl start hal0.target` (the hermes unit is `hermes-gateway.service`). Preflight
     reads "API unreachable" when this was skipped; this is the fix to name in the blocker.
"""

[boxes.ct152-cpu-fresh]
role = "fresh"
ctid = 152
hostname = "hal0-rc5-fresh-2604"
ip = "10.0.1.152"
os = "ubuntu 26.04"
privileged = false
gpu = false
cores = 8
ram_gb = 16
snapshot = "none"
api = "http://10.0.1.152:8080"
auth_required = false
notes = """
Stand-in fresh box built for the rc.5 run, from `local:vztmpl/ubuntu-26.04-standard_26.04-1`
rather than from a snapshot, because ct151's `pct rollback` wedged on a pool-wide ZFS
`z_zrele` deadlock (every `zfs unmount` on rpool blocks; needs a hypervisor reboot to clear).
Same profile as ct151-cpu-fresh: 26.04, unprivileged, CPU-only, 8c/16G/200G.
GOTCHAS:
  1. The PVE standard template ships WITHOUT curl — `curl | bash` fails with
     "curl: command not found" before hal0 is reached. Install curl + ca-certificates first.
  2. No GPU passthrough: the install needs HAL0_ALLOW_CPU_ONLY=1.
  3. No NFS mount; rsync -L test models to /mnt/ai-models. NOTE: /mnt/ai-models is NOT in hal0's
     model roots (`[models] roots = ["/var/lib/hal0/models"]`), so a staged gguf is invisible to
     hal0 until a stateful lane runs `hal0 model add`. Read-only lanes must record this as
     `skipped`, not `fail`.
  4. STILL NO SNAPSHOT, and it is now carrying two runs of residue. Every stateful mutation is
     permanent for the whole run — take a `pristine` snapshot immediately after the next clean
     install, before any lane runs. Known residue after the rc.5 run: a `not-found/failed`
     `hal0-slot@zzskeptic.service` job in `systemctl --failed`; an orphaned
     /var/lib/hal0/models/zzbroken/zzbroken.gguf (2 MB of non-model bytes, handy as a
     deliberately unloadable model); activity.db / hal0.db / .hermes carrying prior history, so
     nothing may assert "no prior activity".
  5. /proc/loadavg is not namespaced in this LXC — it reflects the hypervisor. Use %Cpu and
     per-process CPU, never load average, when arguing about contention.
"""

[boxes.ct150-update]
role = "update"
ctid = 150
hostname = "halo"
ip = "10.0.1.150"
os = "ubuntu 24.04"
privileged = true    # /proc/1/uid_map = full map; 32 cores / 107 GiB — prod-class, unlike every fresh box
gpu = true           # AMD iGPU passthrough + /dev/kfd; slot TOMLs say device=gpu-vulkan but
                      # llama.cpp actually executes on ROCm here (ROCm wins whenever /dev/kfd
                      # is visible) — the vulkan label is a seed lie, not the real backend
api = "http://10.0.1.150:8080"
auth_required = false
notes = """
In-place upgrade lane. Left on the PREVIOUS release; the run upgrades it to the RC under test.
HAL0_RELEASES_URL now points at the GitHub release asset URL (works end-to-end; the historical
file:// stage /var/lib/hal0/rc2/ still exists on disk but holds a stale rc.5 manifest — residue,
not the active source). No snapshot reset: its value is accumulated upgrade history, so record
the exact from-version in CONTEXT.md before upgrading.
UPGRADED rc.5 -> rc.6 on 2026-08-15 and converged; it now sits on 1.0.0-rc.6, so the NEXT run's
from-version is rc.6. Box history: 0.9.8 -> nightly -> rc.1 -> rc.2 -> rc.3 -> rc.5 -> rc.6;
every old tree still under /usr/lib/hal0/.
Carries hermes-agent 0.19.0 from a hand-installed PyPI wheel (DOES ship `hermes_cli/web_dist`),
so it cannot reproduce the fresh-install hermes packaging defects (#1829) — record such checks
as known/skipped with that reason.
KNOWN, do not re-file: #1844 — /usr/local/bin/hal0 is a stale rc.3 wrapper; use
/usr/lib/hal0/venv/bin/hal0 for a truthful CLI, or you will "reproduce" pre-fix behaviour and
misread it as a regression (this happened in rc.6). #1845 (convergence panel remediation).
Seed drift is expected box state, NOT a defect: agent.toml pins context_size = 4096 from an old
seed — upgrades never reconcile slot seeds, which is why Hermes fails here for a DIFFERENT
reason than on a fresh box (see #1827/#1867).
"""

[boxes.ct163-cpu-fresh]
role = "fresh-alt"
ctid = 163
hostname = "hal0-rc2-fresh-2404"
ip = "10.0.1.163"
os = "ubuntu 24.04"
privileged = true
gpu = false
snapshot = "pristine"
notes = """
Second fresh-install box: privileged, older Ubuntu. Not in the default matrix — enable it when
a finding smells privilege- or distro-specific. AppArmor blocks podman until remediated
(#1563 ordering bug; workaround: containers.conf.d apparmor_profile="unconfined").
"""

[boxes.ct105-prod]
role = "prod"
ctid = 105
hostname = "hal0"
ip = "10.0.1.142"
gpu = true
api = "http://10.0.1.142:8080"
auth_required = true
notes = """
PRODUCTION. READ-ONLY, always — no slot loads, no config writes, no service restarts. Its job
in a validation run is to answer "is this finding an artifact of the CPU-only test box?" on
real GPU hardware. Anonymous /api/* returns 401; run `hal0 ...` on the box instead of curl
from the workstation. Not part of the default matrix; opt in per run.

Was running 1.0.0rc5 during the rc.5 validation, which made it an unusually good cross-check —
but it is an UPGRADED box with months of operator tuning, so "prod is fine" is weak evidence
about a fresh install. Specifics found the hard way in rc.5:
  * its venv carries an ORPHANED hermes_cli/web_dist from an older hermes (present in no
    dist-info RECORD), so the fresh-install board-token defect (#1829) cannot be seen here;
  * its brain model carries an operator-set defaults.context_size and its hermes config points
    at a cloud model, so the 64K-floor blocker (#1827) cannot be seen here either;
  * its slots and capability bindings are hand-tuned, so a seeded-default finding will not
    reproduce.
Use it to answer "is this CPU-only or hardware-independent?", never "does a fresh GPU install
work?".
"""

# Fleet coverage note (updated 2026-08-15): ct151 now has iGPU+NPU passthrough and exercises
# the vulkan/container path on fresh installs, so "no GPU fresh box" is closed for the Vulkan
# lane specifically. ct152-cpu-fresh (gpu=false, no /dev/dri) still exists and is CPU-only —
# do not claim "no CPU-only box remains"; it has no snapshot and carries residue, so treat it
# as read-only-usable only (stateful lanes must not run there without a fresh install first).
# The actual remaining gap is a GPU fresh-install box WITH /dev/kfd: ct151 has no /dev/kfd, so
# it only ever exercises the Vulkan lane, and ct150/ct105 both have /dev/kfd but are not fresh
# installs (update/prod) — no box in the fleet is both freshly installed and representative of
# a bare-metal AMD host with amdkfd loaded, which is precisely how the rc.6 Vulkan garbage-output
# defect survived undetected. Also: only prod (ct105) has host rocm-smi, so compute_capable=true
# exists on exactly one box — capability-flag findings need that cross-check. Every box class
# runs the ROCm lane when /dev/kfd is visible and the Vulkan lane otherwise; after rc.6's Vulkan
# garbage-output finding, record which lane a box actually executes
# (podman exec <slot ctr> ls /dev/kfd) in every preflight.
